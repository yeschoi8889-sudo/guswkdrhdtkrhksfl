<title>공사 진행 리포트 · 최고집</title>
<!-- 고객용 공사 진행 리포트. 링크: r.html?s=공개키&a=배포ID → 서버 GET ?s= 로 그 현장 데이터만 받아 그림. 사진은 캔버스로 워터마크를 찍어 보여줌(길게 눌러 저장해도 워터마크 포함) -->
<style>
:root{--rose:#D9487A;--plum:#3A1C33;--blush:#F7DCE3;--lav:#B59CFF;--bg:#F6F4F7;--ink:#1a1a1a;--mute:#5c5460;--line:#E4DEE3;--green:#1E7F4C}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;font-size:16px;line-height:1.4;word-break:keep-all}
.wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
header{background:linear-gradient(160deg,var(--plum),#6b2a5a);color:#fff;padding:22px 18px 66px;position:relative;overflow:hidden}
header .brand{font-size:13px;opacity:.85;font-weight:700}
header h1{font-size:24px;font-weight:800;margin-top:6px;line-height:1.25;padding-right:96px}
header .sub{font-size:14px;opacity:.85;margin-top:4px;padding-right:96px}
header .cz{position:absolute;right:12px;bottom:6px;height:100px;width:auto}
.hero{margin:-48px 14px 0;background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(58,28,51,.12);position:relative}
.hero .now{font-size:19px;font-weight:800;line-height:1.35}.hero .now b{color:var(--rose)}
.hero .till{font-size:14px;color:var(--mute);margin-top:4px}
.bar{height:10px;background:var(--blush);border-radius:999px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:var(--rose);border-radius:999px}
.pct{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;font-size:13px;color:var(--mute);margin-top:6px}.pct b{color:var(--ink)}
h2{font-size:14px;color:var(--mute);font-weight:800;margin:22px 18px 8px}
.card{background:#fff;border-radius:16px;margin:0 14px 10px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.steps .st{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.steps .st:last-child{border:0}
.st i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #d8d2d7;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-style:normal;color:#fff}
.st.done i{background:var(--green);border-color:var(--green)}.st.now i{background:var(--rose);border-color:var(--rose)}.st.now{font-weight:800}
.st span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st small{flex:none;color:var(--mute);font-size:13px}.st.done span,.st.done small{color:#8a838e}
.day{margin:0 14px 14px}.day .dh{font-size:15px;font-weight:800;margin:0 4px 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--blush);color:var(--rose);border-radius:999px;padding:2px 9px;font-weight:700;white-space:nowrap}
.ms{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:15px}.ms.prod{border-left:4px solid var(--lav)}.ms .k{color:var(--mute);font-size:13px;display:block}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e9e4e8}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.v::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;background:rgba(0,0,0,.25)}
.ph .tg{position:absolute;left:6px;top:6px;background:rgba(58,28,51,.8);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;z-index:1}
.ph.nowm::before,.ph.v::before{content:attr(data-wm);position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:rgba(255,255,255,.55);font-weight:800;font-size:11px;padding:0 4px;line-height:1.3;text-shadow:0 0 4px rgba(0,0,0,.6);z-index:1}.ph.v::before{top:auto;bottom:6px;transform:none;font-size:12px}
.ph .cp{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11px;font-weight:700;padding:14px 5px 4px;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms.rep{border-left:4px solid var(--rose)}.ms .memo{font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.5}
.ph .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}
.ba{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);align-items:center;gap:6px}.ba .ph{aspect-ratio:3/4}.ba .ar{text-align:center;color:var(--rose);font-weight:800}
.ba .lb{text-align:center;font-size:13px;font-weight:800;color:var(--mute);margin-top:6px}
footer{margin:28px 14px 0;text-align:center;color:var(--mute);font-size:13px;line-height:1.6}
.yt{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--rose);color:#fff;text-decoration:none;font-weight:800;font-size:16px;border-radius:14px;padding:15px;margin:10px 0 12px}.yt:active{opacity:.85}
.view{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9}.view.on{display:flex}
.view img{max-width:100vw;max-height:80vh;object-fit:contain}.view .cap{color:#fff;font-size:14px;margin-top:10px;text-align:center;padding:0 16px}.view .x{position:absolute;top:14px;right:14px;color:#fff;font-size:28px;background:none;border:0}
.load,.err{padding:60px 20px;text-align:center;color:var(--mute);font-size:16px;line-height:1.6}
</style></head><body>

async function load(){

  if(!url||(API&&!tok)){el.innerHTML='<div class="err">링크가 올바르지 않습니다.<br>최고집에서 받은 링크로 다시 열어주세요.</div>';return;}

  if(!R.ok){el.innerHTML=`<div class="err">${esc(R.error||'링크가 꺼져 있거나 잘못된 링크입니다')}<br>${esc((R.brand||{}).회사||'최고집')}에 문의해 주세요.</div>`;return;}
  R.brand=R.brand||{};WM=R.brand.워터마크||'최고집 - LX하우시스 (예스초이)';WM2=(R.brand.유튜브||'').replace(/\/$/,'').split('/').pop();if(WM2[0]!=='@')WM2='';
  document.title=`${R.site.고객명} 고객님 공사 진행 리포트 · ${R.brand.회사||'최고집'}`;
  el.innerHTML=page();lazy();
}
function page(){
  const s=R.site,t=R.today,ps=R.procs,total=ps.length,done=ps.filter(p=>p.상태==='완료').length;
  const curs=ps.filter(p=>p.시작&&p.끝&&p.시작<=t&&t<=p.끝&&p.상태!=='완료'),nx=ps.find(p=>p.시작&&p.시작>t&&p.상태!=='완료');
  let now,till='';
  if(s.상태==='준공'||(total&&done===total)){now='모든 공사가 끝났습니다 🎉';till=s.준공예정?'준공 '+kd(s.준공예정):'';}
  else if(curs.length){now='지금 '+curs.map(c=>{const i=workdays(pd(c.시작),pd(t)),n=workdays(pd(c.시작),pd(c.끝));return `<b>${esc(short(c.공정))}</b> 공사 중${n>1?(i>=n?' · 마지막 날':` · ${i}일째 / ${n}일`):''}`;}).join('<br>');till=`이 공정은 ${kd(curs.map(c=>c.끝).sort().pop())}까지`;}
  else if(s.착공일&&s.착공일>t){now=`착공 예정 <b>${kd(s.착공일)}</b>`;till=`${days(t,s.착공일)}일 뒤 공사를 시작해요`;}
  else if(nx){now=`다음 공정 <b>${esc(short(nx.공정))}</b>`;till=`${kd(nx.시작)} 시작 예정`;}
  else now='공사 일정을 준비하고 있어요';
  const dd=s.준공예정?days(t,s.준공예정):null,fin=s.준공예정?`준공 예정 <b>${kd(s.준공예정)}</b>${dd>0?` · D-${dd}`:dd===0?' · 오늘':''}`:'준공 예정일은 정해지면 표시돼요';
  const nPic=R.recs.reduce((n,r)=>n+r.media.filter(m=>!m.v).length,0);
  return `<header><div class="brand">${esc(R.brand.회사||'최고집')} 공사 진행 리포트</div><h1>${esc(s.고객명)} 고객님 댁</h1><div class="sub">${esc(s.평형||'')}${s.착공일?` · 착공 ${md(s.착공일)}`:''}</div>${CH?`<img class="cz" alt="" src="${CH}">`:''}</header>
  <div class="hero"><div class="now">${now}</div>${till?`<div class="till">${till}</div>`:''}<div class="bar"><i style="width:${total?Math.round(done/total*100):0}%"></i></div><div class="pct"><span><b>${done}</b> / ${total} 공정 완료</span><span>${fin}</span></div></div>
  ${beforeAfter()}
  <h2>공정 진행표</h2><div class="card steps">${ps.map(p=>{const cur=curs.includes(p)||p.상태==='진행',cls=p.상태==='완료'?'done':cur?'now':'';return `<div class="st ${cls}"><i>${p.상태==='완료'?'✓':cur?'●':''}</i><span>${esc(short(p.공정))}</span><small>${p.시작?md(p.시작)+(p.끝&&p.끝!==p.시작?'~'+md(p.끝):''):'예정'}</small></div>`;}).join('')}</div>
  <h2>현장 기록${nPic?` <span style="font-weight:400">· 사진 ${nPic}장</span>`:''}</h2>${timeline()}
  <footer>${CH?`<img src="${CH}" alt="" style="height:88px">`:''}<div style="font-weight:800;color:var(--plum);font-size:15px">${esc(R.brand.회사||'최고집')}</div><div>${esc(R.brand.소개||'')}</div>
  ${R.brand.유튜브?`<a class="yt" href="${esc(R.brand.유튜브)}" target="_blank" rel="noopener">▶ ${esc(R.brand.유튜브문구||'유튜브 채널 보기')}</a>`:''}

}
function beforeAfter(){

    const prod=rs.filter(r=>r.유형==='제품 선택').map(r=>`<div class="ms prod"><span class="k">선택하신 제품</span>${esc(r.내용||short(r.공정)||'제품 선택')}${r.media.length?`<div class="grid" style="margin-top:8px">${r.media.map(m=>tile(m,d,r.공정)).join('')}</div>`:''}</div>`).join('');
    const reps=rs.filter(r=>r.유형==='고객 보고').map(r=>`<div class="ms rep">${r.내용?`<div class="memo">💬 ${esc(r.내용)}</div>`:''}<div class="grid">${r.media.map(m=>tile(m,d,m.cap||r.공정)).join('')}</div></div>`).join('');
    const pics=rs.filter(r=>r.유형!=='제품 선택'&&r.유형!=='고객 보고').flatMap(r=>r.media.map(m=>tile(m,d,r.공정)));
    return `<div class="day"><div class="dh">${d===R.today?'오늘 · ':''}${kd(d)}${pn.map(n=>`<span class="tag">${esc(n)}</span>`).join('')}</div>${ms}${reps}${prod}${pics.length?`<div class="grid">${pics.join('')}</div>`:''}</div>`;
  }).join('');
}
let TID=0;const TILES={};
function tile(m,d,proc,noTag){const id='t'+(++TID);TILES[id]={m,cap:`${kd(d)}${proc?' · '+short(proc):''}${m.tag?' · '+m.tag:''}`};
  return `<div class="ph ${m.v?'v':''} ${m.cap?'cpd':''}" id="${id}" data-wm="${esc(WM)}" onclick="open_('${id}')">${m.tag&&!noTag?`<span class="tg">${esc(m.tag)}</span>`:''}${m.cap?`<span class="cp">${esc(m.cap)}</span>`:''}</div>`;}
// 보이는 사진부터 4장씩 불러와 워터마크를 찍음
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);enqueue(()=>fill(e.target));}}),{rootMargin:'300px'});
function lazy(){document.querySelectorAll('.ph').forEach(el=>io.observe(el));}
const QQ=[];let act=0;function enqueue(f){QQ.push(f);pump();}function pump(){while(act<4&&QQ.length){act++;QQ.shift()().catch(()=>{}).finally(()=>{act--;pump();});}}
async function fill(el){const t=TILES[el.id];if(!t)return;const im=document.createElement('img');im.alt='';
  if(t.m.v){im.src=t.m.src;im.onerror=()=>{im.remove();el.style.background='#3A1C33';};el.appendChild(im);return;}
  const r=await mark(t.m.src);if(!r.src){el.innerHTML='<div class="wait">사진 준비 중</div>';return;}
  t.url=r.src;if(!r.wm)el.classList.add('nowm');im.src=r.src;el.appendChild(im);}
// 캔버스에 그려 사진 정중앙에 '최고집'(+유튜브 핸들) → 길게 눌러 저장해도 표시가 남음. 그림 서버가 교차 출처를 막으면 원본 그대로 두고 CSS 글자만 얹음(nowm)
function mark(src){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{try{const W=Math.min(im.naturalWidth,1600),H=Math.round(im.naturalHeight*W/im.naturalWidth),c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(im,0,0,W,H);
    let fs=Math.max(30,Math.round(W/9));const F='-apple-system,"Apple SD Gothic Neo",sans-serif';
    g.font=`800 ${fs}px ${F}`;while(g.measureText(WM).width>W*.86&&fs>16){fs-=2;g.font=`800 ${fs}px ${F}`;} // 긴 문구는 폭에 맞춰 줄임
    const cx=W/2,cy=H/2-(WM2?fs*.3:0); // 정중앙 반투명 (가장자리를 잘라도 남음)
    g.textAlign='center';g.textBaseline='middle';g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=fs/4;g.fillStyle='rgba(255,255,255,.5)';
    g.font=`800 ${fs}px ${F}`;g.fillText(WM,cx,cy);
    if(WM2){g.font=`700 ${Math.round(fs*.36)}px ${F}`;g.fillStyle='rgba(255,255,255,.5)';g.fillText('youtube '+WM2,cx,cy+fs*.75);}
    c.toBlob(b=>res({src:b?URL.createObjectURL(b):src,wm:!!b}),'image/jpeg',.86);}catch(e){res({src,wm:false});}};
  im.onerror=()=>{const im2=new Image();im2.onload=()=>res({src,wm:false});im2.onerror=()=>res({src:''});im2.src=src;};im.src=src;});}
async function open_(id){const t=TILES[id];if(!t)return;if(t.m.v){window.open(t.m.href,'_blank');return;}
  if(!t.url){const r=await mark(t.m.src);if(!r.src)return;t.url=r.src;}
  const v=document.getElementById('view');v.querySelector('img').src=t.url;v.querySelector('.cap').textContent=t.cap;v.classList.add('on');history.pushState({v:1},'');}
window.addEventListener('popstate',()=>document.getElementById('view').classList.remove('on'));
load();
</script></body></html>
