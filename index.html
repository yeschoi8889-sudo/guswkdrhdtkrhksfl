<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>최고집 현장OS</title>
<style>
:root{--rose:#D9487A;--plum:#3A1C33;--blush:#F7DCE3;--lav:#B59CFF;--bg:#F6F4F7;--card:#fff;--ink:#222;--mute:#7a6f78;--line:#ECE6EB;--red:#E04848;--green:#2FA86A}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;color:var(--ink);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--plum);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;flex:none}
header .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
header .d{font-size:21px;font-weight:800}header .sub{font-size:12px;opacity:.75;margin-top:2px}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 12px;font-size:15px}
.legend{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.legend span{font-size:11px;padding:3px 9px;border-radius:999px;color:#fff;font-weight:700}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);font-size:11px;text-align:center;color:#999;flex:none}
nav div b{display:block;font-size:20px;margin-bottom:2px}nav .on{color:var(--rose);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);background:var(--rose);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:800;box-shadow:0 8px 20px rgba(217,72,122,.45);z-index:5}
h2{font-size:12px;color:var(--mute);font-weight:600;margin:14px 16px 6px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 12px 8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{font-size:15px;font-weight:800}.s{font-size:12px;color:var(--mute);margin-top:2px}
.tag{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--blush);color:var(--rose);font-weight:700;white-space:nowrap}
.tag.red{background:#FBE3E3;color:var(--red)}.tag.green{background:#E1F5EA;color:var(--green)}.tag.gray{background:#eee;color:#777}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--rose)}
.empty{color:var(--mute);text-align:center;padding:30px 16px;font-size:13px}
/* 달력 */
.cal{background:#fff;padding:6px 6px 8px}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:10px;color:var(--mute);text-align:center;margin-bottom:4px}.wd span:first-child{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.day{height:72px;border-radius:8px;padding:3px 2px;background:#fff;position:relative;border:1px solid #F1EDF0;overflow:hidden}
.day.off{background:#FAF8FA}.day.blank{border:0;background:transparent}
.day .n{font-size:11px;font-weight:700;color:#444;margin:0 0 2px 2px}.day.sun .n{color:var(--red)}.day.sat .n{color:#5b7fd6}
.day.today{border:2px solid var(--rose)}.day.today .n{color:var(--rose)}.day.sel{background:var(--blush)}
.b{height:14px;font-size:9px;line-height:14px;color:transparent;border-radius:3px;margin-bottom:2px;padding:0 3px;white-space:nowrap;overflow:hidden;font-weight:700}
.b.lbl{color:#fff}.b.cont,.b.end{border-radius:0;margin-left:-3px;padding-left:4px}.b.start,.b.cont{margin-right:-3px}.b.end{border-radius:0 3px 3px 0}.b.start{border-radius:3px 0 0 3px}
.b.ev{background:#fff!important;border:1px dashed;font-weight:800}
.site{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.site:last-child{border:0}
.site i{width:10px;height:10px;border-radius:3px;margin-top:5px;flex:none}
.site .t{font-size:14px}
/* 타임라인 */
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px}.chips span{font-size:12px;padding:7px 11px;border-radius:999px;background:#fff;color:#555;border:1px solid var(--line)}.chips span.on{background:var(--plum);color:#fff;border-color:var(--plum);font-weight:700}
.tl{position:relative;padding-left:20px}.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:12px}.ev:last-child{margin-bottom:0}.ev::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--lav)}
.ev.투입::before{background:var(--green)}.ev.특이사항::before{background:var(--rose)}.ev.공정끝::before{background:var(--green)}.ev.날짜변경::before,.ev.공정시작::before{background:#F2994A}
.ev .k{font-size:11px;color:var(--mute)}.ev .bd{font-size:14px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.ev .dt{font-size:12px;color:#555;background:var(--bg);border-radius:8px;padding:8px;margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ev .dt.kakao{background:#FFF7D6;border-left:3px solid #F2C94C}
.pics{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.pics img,.pics div{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#ddd}
.pics .add{background:var(--bg);border:1.5px dashed #bbb;display:flex;align-items:center;justify-content:center;color:#999;font-size:22px}
/* 공정 목록 */
.pl .row{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.pl .row:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;background:#ccc;flex:none}.dot.g{background:var(--green)}.dot.r{background:var(--rose)}.dot.x{background:var(--red)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.kv div{background:var(--bg);border-radius:10px;padding:8px}.kv small{display:block;font-size:10px;color:var(--mute)}.kv b{font-size:14px}
.tabs{display:flex;margin:10px 12px 8px;background:#fff;border-radius:12px;padding:3px}.tabs span{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:13px;color:#777}.tabs span.on{background:var(--plum);color:#fff;font-weight:700}
/* 시트 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none}.dim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);z-index:11;max-height:92vh;overflow-y:auto;display:none}.sheet.on{display:block}
.sheet .h{width:40px;height:4px;background:#ddd;border-radius:9px;margin:0 auto 12px}
.sheet .chips{padding:0}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.types span{text-align:center;padding:9px 4px;border-radius:12px;background:var(--bg);font-size:12px;font-weight:600}.types span em{display:block;font-size:20px;font-style:normal}.types span.on{background:var(--blush);color:var(--rose);outline:2px solid var(--rose)}
label.l{display:block;font-size:11px;color:var(--mute);margin:12px 0 4px}
.in,select.in,textarea.in,input.in{display:block;width:100%;background:var(--bg);border:0;border-radius:12px;padding:12px;font-size:15px;color:#333;outline:none}
textarea.in{min-height:70px;resize:vertical}
.seg{display:flex;gap:6px}.seg span{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--bg);font-size:14px}.seg span.on{background:var(--plum);color:#fff;font-weight:700}
.save{margin-top:14px;background:var(--rose);color:#fff;border:0;border-radius:14px;width:100%;padding:15px;font-size:16px;font-weight:800}
.save:disabled{opacity:.5}
.ghost{margin-top:8px;background:transparent;border:0;width:100%;padding:10px;color:var(--mute);font-size:13px}
.ghost.danger{color:var(--red)}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-top:14px}.tog i{width:46px;height:28px;border-radius:99px;background:#ccc;position:relative;transition:.15s}.tog i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}.tog.on i{background:var(--rose)}.tog.on i::after{left:21px}
.note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}.note.warn{color:#9a6b00;background:#FFF3D1;border-radius:8px;padding:8px}
.more{font-size:13px;color:var(--mute);margin-top:12px;display:flex;justify-content:space-between}
.sync{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:12px;font-size:11px;padding:4px 10px;border-radius:999px;z-index:6;color:#fff;font-weight:700}.sync.wait{background:#F2994A}.sync.ok{background:#2FA86A}.sync.err{background:#E04848}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 140px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:40;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:30;color:var(--mute)}
</style></head>
<body>
<header id="hd"></header>
<main id="main"></main>
<nav id="nav"></nav>
<button class="fab" id="fab">＋ 기록</button>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="sync" id="sync" style="display:none"></div>
<div class="loading" id="loading">불러오는 중…</div>

<script>
// ============ 유틸 ============
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=s=>{const m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],m[2]-1,+m[3]):null};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'';
const DOW='일월화수목금토';
const dow=s=>DOW[pd(s).getDay()];
const isWork=d=>d.getDay()%6!==0;
const addWork=(d,n)=>{d=new Date(d);while(n>0){d.setDate(d.getDate()+1);if(isWork(d))n--;}return d};
const nextWork=d=>addWork(d,1);
const workdays=(a,b)=>{let n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))if(isWork(d))n++;return Math.max(n,1)};
const won=n=>n?Number(n).toLocaleString():'0';
const man=n=>n>=10000?(Math.round(n/10000*10)/10)+'만':won(n);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
const TYPES=[['공정 끝','✅'],['공정 시작','▶️'],['투입','👷'],['현장 점검','🔍'],['특이사항','⚠️'],['고객 대화','💬']];
const ACTIVE=['계약','시공중','AS'];

// ============ 저장 원칙: 기록 먼저, 저장은 뒤에서 ============
// 모든 쓰기 = ① 화면 상태 D 에 즉시 반영 → ② 대기열(IndexedDB)에 기록 → ③ 뒤에서 시트로 순서대로 전송.
// 앱을 바로 꺼도 대기열은 남아 다음에 열 때 이어 보냄. 대기열이 비기 전엔 서버 데이터로 화면을 덮지 않음(체크 풀림 방지).
// 설정: 접속 링크(?api=서버주소&k=키)로 한 번 열면 기기에 저장. 링크를 홈 화면에 추가하면 홈 화면 앱에도 같이 들어감
const CFG=(()=>{let a='',k='';try{const q=new URLSearchParams(location.search);a=q.get('api')||'';k=q.get('k')||'';
  if(a&&k){localStorage.setItem('os_api',a);localStorage.setItem('os_key',k);}else{a=localStorage.getItem('os_api')||'';k=localStorage.getItem('os_key')||'';}}catch(e){}return {api:a,key:k};})();
const GAS=!!(CFG.api&&CFG.key);
const LOCALHOST=/^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);setTimeout(()=>rej(new Error('기기 저장소가 응답하지 않습니다')),5000);const q=indexedDB.open('choegojib_os',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('outbox'))d.createObjectStore('outbox',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>rej(q.error);})},
  tx(store,mode,fn){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction(store,mode),r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);}))},
  add(v){return this.tx('outbox','readwrite',st=>st.add(v))},
  all(){return this.tx('outbox','readonly',st=>st.getAll())},
  del(id){return this.tx('outbox','readwrite',st=>st.delete(id))},
  get(k){return this.tx('kv','readonly',st=>st.get(k))},
  set(k,v){return this.tx('kv','readwrite',st=>st.put(v,k))}
};
async function gas(fn,...args){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),fn==='getData'?30000:90000);
  try{const r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:CFG.key,fn,args}),redirect:'follow',signal:ac.signal});
    const j=await r.json();if(!j.ok){const e=new Error(j.error==='unauthorized'?'접속 키가 맞지 않습니다. 접속 링크로 다시 열어주세요':j.error);e.auth=j.error==='unauthorized';throw e;}return j.data;
  }finally{clearTimeout(tm);}
}
function showSetup(msg){$('#loading').innerHTML='<div style="padding:24px;max-width:420px;margin:0 auto;text-align:center"><b>처음 한 번 설정</b><br><br><span style="font-size:13px;line-height:1.6">'+(msg||'접속 링크를 아래에 붙여넣으세요')+'</span><br><br><textarea id="cfg" class="in" style="min-height:90px" placeholder="https://…/?api=…&k=…"></textarea><button class="save" onclick="applyCfg()">연결</button></div>';}
function applyCfg(){try{const u=new URL($('#cfg').value.trim());const a=u.searchParams.get('api'),k=u.searchParams.get('k');if(!a||!k)throw 0;location.href=location.origin+location.pathname+'?api='+encodeURIComponent(a)+'&k='+encodeURIComponent(k);}catch(e){toast('링크가 올바르지 않습니다');}}
const now=()=>{const d=new Date();return ds(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

let D=null,pending=0,syncErr='',syncing=false;
const S={view:'cal',ym:'',day:'',site:null,tab:'기록',filter:'전체'};

async function api(fn,...args){
  if(fn==='addRecord'){args[0].ID=args[0].ID||newId('r');args[0].일시=args[0].일시||now();}
  if(fn==='addSite')args[0].현장ID=args[0].현장ID||newId('S');
  if(fn==='addTeam')args[0].팀ID=args[0].팀ID||newId('T');
  const qargs=JSON.parse(JSON.stringify(args)); // 서버로 보낼 원본(화면 반영 전 복사)
  const out=LOCAL[fn](...args);                  // ① 즉시 반영
  D.records.sort((x,y)=>x.일시<y.일시?1:-1);
  saveCache();
  if(GAS){try{await IDB.add({fn,args:qargs,t:Date.now()});}catch(e){toast('기기 저장 실패: '+(e.message||e));}pending++;badge();sync();} // ② → ③
  return out;
}
function saveCache(){try{IDB.set('D',JSON.stringify(D));}catch(e){}}
async function sync(){
  if(!GAS||syncing)return;syncing=true;
  try{const ops=await IDB.all();pending=ops.length;badge();
    for(const op of ops){await gas(op.fn,...op.args);await IDB.del(op.id);pending--;badge();}
    syncErr='';if(ops.length){syncing=false;await refresh();}
  }catch(e){syncErr=e.message||String(e);if(!e.auth)setTimeout(sync,15000);}
  finally{syncing=false;badge();}
}
async function refresh(){ // 대기열이 비었을 때만 서버 데이터로 교체
  if(!GAS||syncing)return;const ops=await IDB.all();if(ops.length)return;
  const r=await gas('getData');D=JSON.parse(r);D.records.sort((x,y)=>x.일시<y.일시?1:-1);saveCache();render();
}
function badge(){const el=$('#sync');if(!el)return;if(!GAS){el.style.display='none';return;}
  el.style.display='';clearTimeout(badge.t);
  if(syncErr){el.className='sync err';el.textContent=syncErr.indexOf('접속 키')>=0?syncErr:'저장 대기 '+pending+' · 연결되면 자동 저장';}
  else if(pending>0){el.className='sync wait';el.textContent='저장 중 '+pending;}
  else{el.className='sync ok';el.textContent='모두 저장됨';badge.t=setTimeout(()=>{if(!pending&&!syncErr)el.style.display='none';},2000);}
}
function hideLoading(){$('#loading').style.display='none';}
async function load(){
  let cached=null;try{cached=await IDB.get('D');}catch(e){}
  if(cached){D=JSON.parse(cached);D.today=ds(new Date());if(!S.ym){S.ym=D.today.slice(0,7);S.day=D.today;}render();hideLoading();} // 캐시로 즉시
  if(!GAS&&!LOCALHOST&&!D){showSetup();return;}
  if(!GAS){if(!D){D=SEED();if(!S.ym){S.ym=D.today.slice(0,7);S.day=D.today;}render();hideLoading();}return;}
  try{const ops=await IDB.all().catch(()=>[]);pending=ops.length;badge();
    if(ops.length){sync();}
    else{const r=await gas('getData');D=JSON.parse(r);D.records.sort((x,y)=>x.일시<y.일시?1:-1);if(!S.ym){S.ym=D.today.slice(0,7);S.day=D.today;}saveCache();render();hideLoading();}
  }catch(e){if(!D)$('#loading').innerHTML='<div style="padding:24px;text-align:center"><b>불러오기 실패</b><br><br><span style="font-size:13px">'+esc(e.message||e)+'</span><br><br><button class="save" style="width:auto;padding:10px 20px" onclick="location.reload()">다시 시도</button></div>';else toast('서버 연결 안 됨 · 기록은 기기에 보관됨');}
}
window.addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});setInterval(()=>{if(pending||syncErr)sync();},20000);

const siteById=id=>D.sites.find(s=>s.현장ID===id);
const teamById=id=>D.teams.find(t=>t.팀ID===id);
const procsOf=id=>D.procs.filter(p=>p.현장ID===id).sort((a,b)=>a.순번-b.순번);
const procAt=(id,seq)=>D.procs.find(p=>p.현장ID===id&&+p.순번===+seq);
const liveOf=id=>procsOf(id).filter(p=>p.상태!=='제외');
const dated=p=>p.시작&&p.끝&&p.상태!=='제외';
const activeSites=()=>D.sites.filter(s=>ACTIVE.includes(s.상태));
const curProc=(id,day)=>liveOf(id).find(p=>dated(p)&&p.시작<=day&&day<=p.끝)||liveOf(id).find(p=>p.상태==='진행')||liveOf(id).find(p=>p.상태!=='완료');
const late=p=>dated(p)&&p.끝<D.today&&p.상태!=='완료';
const thumb=id=>id.startsWith('data:')?id:`https://drive.google.com/thumbnail?id=${id}&sz=w600`;

// ============ 화면 상태 적용 (서버 Code.gs 와 같은 규칙) ============
const LOCAL={
  addSite(s){const used=activeSites().map(x=>x.색);s.색=s.색||D.base.lists.색.find(c=>!used.includes(c))||D.base.lists.색[D.sites.length%D.base.lists.색.length];s.상태=s.상태||'계약';s.준공예정=s.준공예정||'';
    if(siteById(s.현장ID)){Object.assign(siteById(s.현장ID),s);return s.현장ID;}
    D.procs.push(...D.base.procs.map(p=>({현장ID:s.현장ID,순번:+p.순번,공정:p.공정,담당팀:'',시작:'',끝:'',상태:'예정',메모:''})));D.sites.push(s);return s.현장ID;},
  updateSite(id,p){Object.assign(siteById(id)||{},p);},
  updateProc(id,seq,p){Object.assign(procAt(id,seq)||{},p);},
  shiftProc(id,seq,end,follow,start){const r=simShift(id,seq,end,follow,start);if(!r)return null;r.procs.forEach(p=>Object.assign(procAt(id,p.순번),p));siteById(id).준공예정=r.준공예정;return r;},
  saveSchedule(id,rows){rows.forEach(r=>{const p=procAt(id,r.순번);if(p)Object.assign(p,{시작:r.시작||'',끝:r.끝||'',상태:r.상태||'예정'});});const ends=rows.filter(r=>r.끝&&r.상태!=='제외').map(r=>r.끝).sort();siteById(id).준공예정=ends.pop()||'';},
  addProc(id,name,after){const ps=procsOf(id);const seq=after?+after+1:ps.reduce((m,p)=>Math.max(m,+p.순번),0)+1;ps.filter(p=>+p.순번>=seq).forEach(p=>p.순번=+p.순번+1);D.procs.push({현장ID:id,순번:seq,공정:name,담당팀:'',시작:'',끝:'',상태:'예정',메모:''});return seq;},
  deleteProc(id,seq){D.procs=D.procs.filter(p=>!(p.현장ID===id&&+p.순번===+seq));},
  addRecord(r,photos){if(D.records.find(x=>x.ID===r.ID))return r.ID;
    if(photos&&photos.length)r.사진=photos.map(p=>'data:image/jpeg;base64,'+p.b64).concat(r.사진?String(r.사진).split('|'):[]).join('|');
    if(r.유형==='투입'&&!r.금액&&r.단가)r.금액=(+r.공수||0)*(+r.단가||0);
    if(r.유형==='공정 끝'&&r._seq){const p=procAt(r.현장ID,r._seq);if(p)p.상태='완료';}
    if((r.유형==='공정 시작'||r.유형==='날짜 변경')&&r._seq&&r._newEnd){const res=LOCAL.shiftProc(r.현장ID,r._seq,r._newEnd,r._follow!==false,r.일시.slice(0,10));const p=procAt(r.현장ID,r._seq);if(p)p.상태='진행';r.내용=`${r.공정} ${md(r.일시)} ~ ${md(r._newEnd)}${res&&res.moved?' · 뒤 공정 '+res.moved+'개 이동':''}${r.내용?' · '+r.내용:''}`;}
    delete r._seq;delete r._newEnd;delete r._follow;D.records.push(r);return r.ID;},
  updateRecord(id,p){Object.assign(D.records.find(r=>r.ID===id)||{},p);},
  deleteRecord(id){D.records=D.records.filter(r=>r.ID!==id);},
  addTeam(t){if(teamById(t.팀ID))return t.팀ID;D.teams.push(t);return t.팀ID;},
  updateTeam(id,p){Object.assign(teamById(id)||{},p);}
};

// ============ 렌더 ============
function render(){
  const v=S.view;
  $('#nav').innerHTML=[['cal','📅','달력'],['sites','🏠','현장'],['teams','👷','외주팀']].map(([k,i,n])=>`<div class="${(v===k||(k==='sites'&&v==='site'))?'on':''}" onclick="go('${k}')"><b>${i}</b>${n}</div>`).join('');
  ({cal:renderCal,sites:renderSites,site:renderSite,teams:renderTeams})[v]();
}
function go(v,id){S.view=v;if(id)S.site=id;if(v==='site'){S.tab='기록';S.filter='전체';}render();$('#main').scrollTop=0;}

// ---- 달력 ----
function renderCal(){
  const [y,m]=S.ym.split('-').map(Number);
  $('#hd').innerHTML=`<div class="row"><span class="d">${y}년 ${m}월</span><span><button onclick="moveMonth(-1)">‹</button> <button onclick="moveMonth(0)">오늘</button> <button onclick="moveMonth(1)">›</button></span></div>
  <div class="legend">${activeSites().map(s=>`<span style="background:${s.색}">${esc(s.고객명)} ${esc(s.평형||'')}</span>`).join('')||'<span style="background:#999">현장 없음</span>'}</div>`;
  const first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  let g='';for(let i=0;i<first;i++)g+='<div class="day blank"></div>';
  for(let d=1;d<=days;d++){
    const ds_=`${S.ym}-${String(d).padStart(2,'0')}`, w=(first+d-1)%7;
    let bars='';
    D.sites.forEach(s=>{
      const evs=[];if(s.착공일===ds_)evs.push('착공');if(s.준공예정===ds_)evs.push('준공');if(s.계약일===ds_&&['상담','계약'].includes(s.상태))evs.push(s.상태);
      evs.forEach(e=>bars+=`<div class="b ev" style="border-color:${s.색};color:${s.색}">${e}</div>`);
      if(w===0||w===6)return;
      const p=liveOf(s.현장ID).find(p=>dated(p)&&p.시작<=ds_&&ds_<=p.끝);if(!p)return;
      const pos=p.시작===p.끝?'':p.시작===ds_?'start':p.끝===ds_?'end':'cont';
      bars+=`<div class="b ${pos} ${(p.시작===ds_||w===1)?'lbl':''}" style="background:${s.색}">${esc(p.공정.split('(')[0])}</div>`;
    });
    g+=`<div class="day ${w===0?'sun off':w===6?'sat off':''} ${ds_===D.today?'today':''} ${ds_===S.day?'sel':''}" onclick="pickDay('${ds_}')"><div class="n">${d}</div>${bars}</div>`;
  }
  $('#main').innerHTML=`<div class="cal"><div class="wd">${[...'일월화수목금토'].map(c=>`<span>${c}</span>`).join('')}</div><div class="grid">${g}</div></div>${dayPanel()}`;
}
function moveMonth(n){if(n===0){S.ym=D.today.slice(0,7);S.day=D.today;}else{const [y,m]=S.ym.split('-').map(Number);const d=new Date(y,m-1+n,1);S.ym=ds(d).slice(0,7);S.day=S.ym+'-01';}render();}
function pickDay(d){S.day=d;render();}
function dayPanel(){
  const day=S.day;
  const rows=D.sites.map(s=>{
    const p=liveOf(s.현장ID).find(p=>dated(p)&&p.시작<=day&&day<=p.끝);
    const evs=[];if(s.착공일===day)evs.push('착공 · 📷 비포 촬영');if(s.준공예정===day)evs.push('준공예정 · 📷 애프터 촬영');if(s.계약일===day)evs.push(s.상태==='상담'?'상담':'계약');
    if(!p&&!evs.length)return '';
    const recs=D.records.filter(r=>r.현장ID===s.현장ID&&r.일시.slice(0,10)===day);
    const lt=p&&late(p)?`<span class="tag red">지연</span>`:'';
    return `<div class="site" onclick="go('site','${s.현장ID}')"><i style="background:${s.색}"></i><div style="flex:1"><div class="t">${esc(s.고객명)} ${esc(s.평형||'')} · ${p?esc(p.공정):evs[0]} ${lt}</div>
      <div class="s">${[p&&p.담당팀?esc(teamName(p.담당팀)):'',p?`${md(p.시작)}~${md(p.끝)}`:'',recs.length?`기록 ${recs.length}`:'',...(p?evs:[])].filter(Boolean).join(' · ')}</div></div></div>`;
  }).join('');
  return `<h2>${+day.slice(8)}일 ${dow(day)}${day===D.today?' · 오늘':''}</h2><div class="card">${rows||'<div class="empty">이 날 공정 없음</div>'}</div>`;
}
const teamName=id=>{const t=teamById(id);return t?t.팀명:id};

// ---- 현장 목록 ----
function renderSites(){
  $('#hd').innerHTML=`<div class="row"><span class="d">현장</span><button onclick="openSiteForm()">＋ 새 현장</button></div>`;
  const order=s=>({시공중:0,계약:1,AS:2,상담:3,준공:4,취소:5}[s.상태]??9);
  const list=[...D.sites].sort((a,b)=>order(a)-order(b)||(b.착공일||'').localeCompare(a.착공일||''));
  $('#main').innerHTML=list.map(s=>{
    const ps=liveOf(s.현장ID),done=ps.filter(p=>p.상태==='완료').length,cp=curProc(s.현장ID,D.today),lt=ps.filter(late).length,nodate=ps.filter(p=>!p.시작).length;
    return `<div class="card" onclick="go('site','${s.현장ID}')"><div class="row"><div><div class="t"><i class="dot" style="background:${s.색}"></i>${esc(s.고객명)} ${esc(s.평형||'')}</div><div class="s">${esc(s.주소||'')}</div></div><span class="tag ${s.상태==='시공중'?'':s.상태==='준공'?'green':'gray'}">${s.상태}</span></div>
      ${ps.length?`<div class="bar"><i style="width:${Math.round(done/ps.length*100)}%"></i></div><div class="s" style="margin-top:6px">${done}/${ps.length} 공정 · ${cp?esc(cp.공정):'완료'} · 준공 ${md(s.준공예정)||'미정'} ${lt?`<span class="tag red">지연 ${lt}</span>`:''}${nodate?`<span class="tag gray">일정 미정 ${nodate}</span>`:''}</div>`:``}</div>`;
  }).join('')||'<div class="empty">현장을 추가하세요</div>';
}

// ---- 현장 상세 ----
function renderSite(){
  const s=siteById(S.site);if(!s)return go('sites');
  const ps=liveOf(s.현장ID),done=ps.filter(p=>p.상태==='완료').length,cp=curProc(s.현장ID,D.today);
  const labor=D.records.filter(r=>r.현장ID===s.현장ID&&r.유형==='투입').reduce((a,r)=>a+(+r.금액||0),0);
  $('#hd').innerHTML=`<div class="row"><div><div class="d"><span onclick="go('sites')" style="opacity:.7">‹</span> ${esc(s.고객명)} ${esc(s.평형||'')}</div><div class="sub">${esc(s.주소||'')} ${s.연락처?'· '+esc(s.연락처):''}</div></div><button onclick="openSiteForm('${s.현장ID}')">정보</button></div>`;
  let body=`<div class="card" style="margin-top:10px"><div class="row"><span class="t">진척 ${ps.length?Math.round(done/ps.length*100):0}%</span><span class="s">${done}/${ps.length} 공정 · <span class="tag ${s.상태==='시공중'?'':'gray'}">${s.상태}</span></span></div><div class="bar"><i style="width:${ps.length?done/ps.length*100:0}%"></i></div>
    <div class="kv"><div><small>계약금액</small><b>${s.계약금액?man(+s.계약금액):'—'}</b></div><div><small>노무비 누계</small><b>${man(labor)}</b></div><div><small>지금 공정</small><b style="font-size:12px">${cp?esc(cp.공정.split('(')[0]):'—'}</b></div></div>
    <div class="note">📷 비포 ${md(s.착공일)||'—'} · 애프터 ${md(s.준공예정)||'—'} (준공 당일)</div></div>
    <div class="tabs"><span class="${S.tab==='기록'?'on':''}" onclick="S.tab='기록';render()">기록</span><span class="${S.tab==='공정'?'on':''}" onclick="S.tab='공정';render()">공정 ${ps.filter(late).length?'⚠️':''}</span></div>`;
  body+=S.tab==='기록'?timeline(s):procList(s);
  $('#main').innerHTML=body;
}
function timeline(s){
  const all=D.records.filter(r=>r.현장ID===s.현장ID);
  const f=S.filter, list=f==='전체'?all:all.filter(r=>r.유형===f);
  const chips=['전체',...TYPES.map(t=>t[0])].map(t=>`<span class="${f===t?'on':''}" onclick="S.filter='${t}';render()">${t}</span>`).join('');
  if(!list.length)return `<div class="chips">${chips}</div><div class="empty">기록 없음. 아래 ＋ 기록</div>`;
  const groups={};list.forEach(r=>{(groups[r.일시.slice(0,10)]=groups[r.일시.slice(0,10)]||[]).push(r)});
  return `<div class="chips">${chips}</div>`+Object.keys(groups).sort().reverse().map(d=>{
    const p=liveOf(s.현장ID).find(p=>dated(p)&&p.시작<=d&&d<=p.끝);
    return `<h2>${md(d)} ${dow(d)}${p?' · '+esc(p.공정.split('(')[0]):''}</h2><div class="card tl">${groups[d].map(r=>recHtml(r)).join('')}</div>`;}).join('');
}
function recHtml(r){
  const ico=Object.fromEntries(TYPES)[r.유형]||'•';
  const pics=r.사진?`<div class="pics">${String(r.사진).split('|').filter(Boolean).map(id=>`<img src="${thumb(id)}" onclick="event.stopPropagation();openPhoto('${id}')">`).join('')}</div>`:'';
  const sub=r.유형==='투입'?` · ${esc(teamName(r.팀ID))} ${r.단가?won(r.단가)+'×':''}${r.공수} · ${won(r.금액)}원${r.지급?' ✓지급':''}`:'';
  return `<div class="ev ${r.유형.replace(' ','')}" onclick="openRecordEdit('${r.ID}')"><div class="k">${r.일시.slice(11)} · ${ico} ${esc(r.유형)}${esc(sub)}</div><div class="bd">${esc(r.내용)}</div>${r.상세?`<div class="dt ${r.유형==='고객 대화'?'kakao':''}">${esc(r.상세)}</div>`:''}${pics}</div>`;
}
function procList(s){
  const ps=procsOf(s.현장ID);
  if(!ps.length)return `<div class="empty">공정이 없습니다</div>`;
  const nodate=ps.filter(p=>p.상태!=='제외'&&!p.시작).length;
  return `<div style="margin:0 12px 8px;display:flex;gap:8px"><button class="save" style="margin:0;flex:1" onclick="openSchedule('${s.현장ID}')">📅 일정 잡기${nodate?` · 미정 ${nodate}`:''}</button><button class="save" style="margin:0;width:auto;background:var(--plum)" onclick="openAddProc('${s.현장ID}')">＋ 공정</button></div>
    <div class="card pl">${ps.map(p=>`<div class="row" onclick="openProc('${s.현장ID}',${p.순번})" style="${p.상태==='제외'?'opacity:.4':''}"><span style="display:flex;align-items:center;min-width:0"><i class="dot ${p.상태==='완료'?'g':p.상태==='진행'?'r':late(p)?'x':''}"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.순번} ${esc(p.공정)}</span></span>
    <span class="s" style="white-space:nowrap">${p.상태==='제외'?'제외':p.시작?`${p.담당팀?esc(teamName(p.담당팀))+' · ':''}${md(p.시작)}${p.시작!==p.끝?'~'+md(p.끝):''}`:'<span style="color:#bbb">날짜 없음</span>'} ${late(p)?'<span class="tag red">지연</span>':p.상태==='진행'?'<span class="tag">진행</span>':''}</span></div>`).join('')}</div>
    <div class="note" style="margin:0 16px">공정을 누르면 상태·담당팀·날짜를 바꿀 수 있고, 끝 날짜를 바꾸면 뒤 공정이 같이 밀립니다.</div>`;
}

// ---- 일정 잡기: 공정별 시작~끝을 대표님이 직접 ----
const SC={rows:[]};
function openSchedule(siteId){
  SC.site=siteId;SC.rows=procsOf(siteId).map(p=>({순번:p.순번,공정:p.공정,시작:p.시작||'',끝:p.끝||'',상태:p.상태}));
  drawSchedule();
}
function drawSchedule(){
  const s=siteById(SC.site);
  openSheet(`<div class="row"><div class="t">일정 잡기 · ${esc(s.고객명)}</div><span class="s">끝 비우면 하루</span></div>
    <div class="note">시작을 넣으면 다음 공정 시작이 그 다음 근무일로 미리 채워집니다. 전부 고칠 수 있고, 안 하는 공정은 ✕.</div>
    <div class="pl" style="margin-top:6px">${SC.rows.map((r,i)=>`<div class="row" style="padding:7px 0;gap:6px;${r.상태==='제외'?'opacity:.4':''}">
      <span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.순번} ${esc(r.공정.split('(')[0])}</span>
      <input type="date" class="in" style="width:118px;padding:8px 4px;font-size:12px" value="${r.시작}" ${r.상태==='제외'?'disabled':''} onchange="scSet(${i},'시작',this.value)">
      <input type="date" class="in" style="width:118px;padding:8px 4px;font-size:12px" value="${r.끝}" ${r.상태==='제외'?'disabled':''} onchange="scSet(${i},'끝',this.value)">
      <span style="width:22px;text-align:center;color:#999" onclick="scToggle(${i})">${r.상태==='제외'?'＋':'✕'}</span></div>`).join('')}</div>
    <div class="note" id="sc_sum">${scSummary()}</div>
    <button class="save" onclick="saveSchedule()">저장</button>
    <button class="ghost" onclick="openAddProc('${s.현장ID}')">＋ 공정 추가 (목록에 없는 공정)</button>
    <button class="ghost" onclick="scStandard()">LX 표준 소요일로 초안 채우기 (${s.착공일?md(s.착공일)+'부터':'착공일 필요'})</button>`);
}
function scSet(i,k,v){
  const r=SC.rows[i];r[k]=v;
  if(k==='시작'&&v&&(!r.끝||r.끝<v))r.끝=v;
  if(k==='끝'&&v&&r.시작&&r.시작>v)r.시작=v;
  if(k==='끝'&&v){const n=SC.rows.slice(i+1).find(x=>x.상태!=='제외');if(n&&!n.시작){n.시작=ds(nextWork(pd(v)));n.끝=n.끝||n.시작;}}
  drawSchedule();
}
function scToggle(i){const r=SC.rows[i];r.상태=r.상태==='제외'?'예정':'제외';drawSchedule();}
function scSummary(){const live=SC.rows.filter(r=>r.상태!=='제외'),ends=live.filter(r=>r.끝).map(r=>r.끝).sort();return `공정 ${live.length}개 · 날짜 없는 공정 ${live.filter(r=>!r.시작).length} · 준공예정 ${ends.length?md(ends[ends.length-1]):'미정'}`;}
function scStandard(){
  const s=siteById(SC.site);if(!s.착공일)return toast('현장 정보에 착공일을 먼저 넣으세요');
  let d=pd(s.착공일);if(!isWork(d))d=nextWork(d);
  SC.rows.forEach(r=>{if(r.상태==='제외'||r.상태==='완료')return;const dur=D.base.procs.find(b=>b.공정===r.공정)?.기본소요일||1;const st=new Date(d),en=addWork(st,dur-1);r.시작=ds(st);r.끝=ds(en);d=nextWork(en);});
  drawSchedule();
}
function openAddProc(siteId){
  const ps=procsOf(siteId);
  openSheet(`<div class="t">공정 추가</div><label class="l">공정 이름 *</label><input class="in" id="ap_name" placeholder="예: 탄성코트, 줄눈, 방충망">

function setGs(g,typed){R.gs=g||0;$$('#r_gs span').forEach(e=>e.classList.toggle('on',!typed&&+e.textContent===g));if(!typed)$('#r_gs_in').value='';calcAmt();}
function calcAmt(){const rate=+val('r_rate').replace(/\D/g,'');$('#r_amt').value=rate&&R.gs?Math.round(rate*R.gs):'';}
function simShift(siteId,seq,newEnd,follow,newStart){ // 서버 shiftProc 과 같은 계산 (미리보기·목업용)
  const ps=procsOf(siteId).map(p=>({...p}));const t=ps.find(p=>+p.순번===+seq);if(!t)return null;
  if(!newEnd||!(newStart||t.시작))return null;let end=pd(newEnd),start=pd(newStart||t.시작);if(end<start)start=end;t.시작=ds(start);t.끝=ds(end);let cursor=end,moved=0;
  if(follow)ps.filter(p=>+p.순번>+seq&&dated(p)&&p.상태!=='완료').forEach(p=>{const dur=workdays(pd(p.시작),pd(p.끝));const st=nextWork(cursor),en=addWork(st,dur-1);if(ds(st)!==p.시작||ds(en)!==p.끝){p.시작=ds(st);p.끝=ds(en);moved++;}cursor=en;});
  return {procs:ps,moved,준공예정:ps.filter(dated).map(p=>p.끝).sort().pop()||''};
}
function shiftPreview(){
  const s=siteById(R.site),r=simShift(R.site,val('r_proc'),val('r_date'),R.follow,D.today);if(!r){$('#r_prev').textContent='';return;}

  $('#r_prev').innerHTML=`${md(D.today)} ~ ${md(val('r_date'))} · 뒤 공정 ${r.moved}개 이동 · 준공예정 ${md(s.준공예정)} → <b>${md(r.준공예정)}</b> · 📷 애프터 ${md(r.준공예정)}${conf.length?`<div class="note warn" style="margin-top:6px">⚠️ ${[...new Set(conf)].join('<br>')}</div>`:''}`;
}

  openSheet(`<div class="t">${id?'현장 정보':'새 현장'}</div>
    <label class="l">고객명 *</label><input class="in" id="s_name" value="${esc(s.고객명||'')}" placeholder="예: 김○○ 세곡동">
    <label class="l">평형</label><input class="in" id="s_py" value="${esc(s.평형||'')}" placeholder="예: 32평">
    <label class="l">주소</label><input class="in" id="s_addr" value="${esc(s.주소||'')}">
    <label class="l">연락처</label><input class="in" id="s_tel" inputmode="tel" value="${esc(s.연락처||'')}">
    <label class="l">계약금액</label><input class="in" id="s_amt" inputmode="numeric" value="${s.계약금액||''}">
    <label class="l">상태</label><select class="in" id="s_st">${opt(D.base.lists.현장상태,s.상태)}</select>
    <label class="l">계약일</label><input type="date" class="in" id="s_c" value="${s.계약일||''}">
    <label class="l">착공일 (비포 촬영일 · 표준 초안 기준일)</label><input type="date" class="in" id="s_start" value="${s.착공일||''}">
    <label class="l">메모</label><textarea class="in" id="s_memo">${esc(s.메모||'')}</textarea>
    <button class="save" onclick="saveSite('${id||''}')">저장</button>`);
}
async function saveSite(id){
  const p={고객명:val('s_name'),평형:val('s_py'),주소:val('s_addr'),연락처:val('s_tel'),계약금액:+val('s_amt').replace(/\D/g,'')||'',상태:val('s_st'),계약일:val('s_c'),착공일:val('s_start'),메모:val('s_memo')};
  if(!p.고객명)return toast('고객명을 쓰세요');
  if(id)await api('updateSite',id,p);else{const nid=await api('addSite',p);closeSheet();toast('현장 추가됨 · 일정을 잡으세요');render();S.site=nid;S.view='site';S.tab='공정';render();return;}
  closeSheet();toast('저장됨');render();
}

// ---- 팀 ----
function openTeamForm(id){
  const t=id?teamById(id):{};
  openSheet(`<div class="t">${id?'팀 정보':'새 팀'}</div>
    <label class="l">팀명 *</label><input class="in" id="t_name" value="${esc(t.팀명||'')}" placeholder="예: 타일팀 박반장">
    <label class="l">공종</label><select class="in" id="t_kind">${opt(D.base.procs.map(p=>p.공종),t.공종,x=>x,x=>x,'—')}</select>
    <label class="l">대표자 · 연락처</label><input class="in" id="t_rep" value="${esc(t.대표자||'')}" placeholder="이름"><input class="in" id="t_tel" inputmode="tel" value="${esc(t.연락처||'')}" placeholder="010-" style="margin-top:6px">
    <label class="l">계좌</label><input class="in" id="t_acct" value="${esc(t.계좌||'')}">
    <button class="save" onclick="saveTeam('${id||''}')">저장</button>`);
}
async function saveTeam(id){
  const p={팀명:val('t_name'),공종:val('t_kind'),대표자:val('t_rep'),연락처:val('t_tel'),계좌:val('t_acct')};
  if(!p.팀명)return toast('팀명을 쓰세요');
  const nid=await api(id?'updateTeam':'addTeam',...(id?[id,p]:[p]));closeSheet();toast('저장됨');render();if(R.back){R.back=false;openRecord('투입',R.site);if(nid)$('#r_team').value=nid;}
  else if(R.backProc){const b=R.backProc;R.backProc=null;openProc(b.s,b.q);if(nid)$('#p_team').value=nid;if(b.st)$$('#p_st span').forEach(e=>e.classList.toggle('on',e.textContent===b.st));if(b.a)$('#p_start').value=b.a;if(b.b)$('#p_end').value=b.b;}
}
