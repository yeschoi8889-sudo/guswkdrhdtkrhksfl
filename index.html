<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3A1C33">
<title>최고집 현장OS</title>
<style>
:root{--rose:#D9487A;--plum:#3A1C33;--blush:#F7DCE3;--lav:#B59CFF;--bg:#F6F4F7;--card:#fff;--ink:#1a1a1a;--mute:#5c5460;--line:#E4DEE3;--red:#C62828;--green:#1E7F4C;--blue:#2F6FD6}
html{font-size:18px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;color:var(--ink);font-size:1rem;line-height:1.35;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
header{background:var(--plum);color:#fff;padding:calc(env(safe-area-inset-top) + .8rem) 1rem .7rem;flex:none}
header .row{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
header .d{font-size:1.45rem;font-weight:800;line-height:1.2}header .sub{font-size:.85rem;opacity:.88;margin-top:.2rem}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:.6rem;padding:.5rem .8rem;font-size:.95rem;font-weight:700;white-space:nowrap}
.fsrow{display:flex;gap:.35rem;align-items:center;font-size:.8rem;margin-top:.6rem}.fsrow span{background:rgba(255,255,255,.18);border-radius:.5rem;padding:.3rem .6rem}.fsrow span.on{background:#fff;color:var(--plum);font-weight:800}
.seg2{display:flex;background:rgba(255,255,255,.18);border-radius:.7rem;padding:.2rem;flex:none}.seg2 span{padding:.4rem .9rem;border-radius:.55rem;font-size:.95rem;font-weight:700}.seg2 span.on{background:#fff;color:var(--plum)}
.legend{display:flex;gap:.3rem;margin-top:.6rem;flex-wrap:wrap}.legend span{font-size:.75rem;padding:.2rem .6rem;border-radius:999px;color:#fff;font-weight:700}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.7rem 0 .6rem}
.bbar{flex:none;padding:.4rem .75rem .5rem;background:var(--bg)}.bbar button{width:100%;border:0;background:var(--rose);color:#fff;border-radius:1rem;font-size:1.25rem;font-weight:800;padding:1rem;box-shadow:0 .4rem 1rem rgba(217,72,122,.35)}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding:.45rem 0 calc(env(safe-area-inset-bottom) + .45rem);font-size:.8rem;text-align:center;color:#777;font-weight:700;flex:none}
nav div b{display:block;font-size:1.4rem;margin-bottom:.05rem}nav .on{color:var(--rose)}
h2{font-size:.85rem;color:var(--mute);font-weight:700;margin:.9rem 1rem .4rem}
.card{background:var(--card);border-radius:1rem;padding:.8rem .9rem;margin:0 .75rem .6rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.scard{background:#fff;border-radius:1rem;padding:.9rem 1rem;margin:0 .75rem .7rem;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:.5rem solid #ccc}
.scard .n{font-size:1.25rem;font-weight:800;line-height:1.25}.scard .t{font-size:1.05rem;margin-top:.35rem}.scard .t b{color:var(--rose)}
.scard .nx{font-size:.95rem;color:var(--mute);margin-top:.3rem}.scard .warn{font-size:.95rem;color:var(--red);font-weight:700;margin-top:.4rem}.scard .pct{font-size:.85rem;color:var(--mute);margin-top:.3rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.t{font-size:1rem;font-weight:800}.s{font-size:.85rem;color:var(--mute);margin-top:.15rem}
.tag{font-size:.75rem;padding:.15rem .55rem;border-radius:999px;background:var(--blush);color:var(--rose);font-weight:700;white-space:nowrap;vertical-align:middle}
.tag.red{background:#FBE3E3;color:var(--red)}.tag.green{background:#E1F5EA;color:var(--green)}.tag.gray{background:#eee;color:#666}
.bar{height:.55rem;background:#EEE8EC;border-radius:99px;overflow:hidden;margin-top:.6rem}.bar i{display:block;height:100%;background:var(--rose)}
.empty{color:var(--mute);text-align:center;padding:2rem 1rem;font-size:1rem;line-height:1.6}
.sum{display:flex;gap:.5rem;margin:0 .75rem .7rem}.sum div{flex:1;background:#fff;border-radius:.9rem;padding:.55rem .3rem;text-align:center}.sum b{display:block;font-size:1.5rem}.sum span{font-size:.75rem;color:var(--mute)}.sum .r b{color:var(--red)}
/* 주간 */
.wnav{display:flex;justify-content:space-between;align-items:center;margin:0 .75rem .6rem}.wnav span,.wnav b{background:#fff;border-radius:.7rem;padding:.55rem .8rem;font-size:.95rem;font-weight:700}.wnav b{background:var(--plum);color:#fff}
.wk{background:#fff;border-radius:1rem;margin:0 .75rem .7rem;overflow:hidden}
.wday{display:flex;gap:.6rem;padding:.65rem .8rem;border-bottom:1px solid var(--line);align-items:flex-start;min-height:3.4rem}.wday:last-child{border:0}
.wday .dn{width:2.9rem;text-align:center;flex:none}.wday .dn b{display:block;font-size:1.3rem;line-height:1.1}.wday .dn span{font-size:.7rem;color:var(--mute)}.wday.sun .dn b{color:var(--red)}.wday.sat .dn b{color:var(--blue)}
.wday.today{background:var(--blush)}.wday.today .dn b{color:var(--rose)}
.wday .ev{flex:1;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.chip{display:flex;align-items:center;gap:.4rem;font-size:.95rem;font-weight:700;flex-wrap:wrap}.chip i{width:.8rem;height:.8rem;border-radius:.2rem;flex:none}.chip small{font-weight:400;color:var(--mute);font-size:.8rem}.chip small.r{color:var(--red);font-weight:700}
.off{color:#aaa;font-size:.9rem}
/* 월간 */
.cal{background:#fff;padding:.3rem .3rem .4rem;margin:0 .5rem .6rem;border-radius:.8rem}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:.7rem;color:var(--mute);text-align:center;margin-bottom:.2rem}.wd span:first-child{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.day{height:4.2rem;border-radius:.4rem;padding:.15rem .1rem;background:#fff;border:1px solid #F1EDF0;overflow:hidden}
.day.off{background:#FAF8FA}.day.blank{border:0;background:transparent}
.day .n{font-size:.75rem;font-weight:700;color:#444;margin:0 0 .1rem .15rem}.day.sun .n{color:var(--red)}.day.sat .n{color:var(--blue)}
.day.today{border:2px solid var(--rose)}.day.today .n{color:var(--rose)}.day.sel{background:var(--blush)}
.b{height:.85rem;font-size:.6rem;line-height:.85rem;color:transparent;border-radius:3px;margin-bottom:2px;padding:0 3px;white-space:nowrap;overflow:hidden;font-weight:700}
.b.lbl{color:#fff}.b.cont,.b.end{border-radius:0;margin-left:-3px;padding-left:4px}.b.start,.b.cont{margin-right:-3px}.b.end{border-radius:0 3px 3px 0}.b.start{border-radius:3px 0 0 3px}
.b.ev{background:#fff!important;border:1px dashed;font-weight:800}
.site{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px solid var(--line)}.site:last-child{border:0}.site i{width:.7rem;height:.7rem;border-radius:.2rem;margin-top:.35rem;flex:none}.site .t{font-size:1rem}
/* 현장 상세 */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;margin-top:.7rem}.kv div{background:var(--bg);border-radius:.8rem;padding:.6rem .7rem}.kv small{display:block;font-size:.75rem;color:var(--mute)}.kv b{font-size:1.1rem}
.lines{padding:.2rem .9rem}.ln{display:flex;flex-direction:column;padding:.6rem 0;border-bottom:1px solid var(--line)}.ln:last-child{border:0}.ln .k{font-size:.8rem;color:var(--mute)}.ln .v{font-size:1.05rem;font-weight:700;margin-top:.1rem}.ln .v b{color:var(--rose)}.ln.r .v{color:var(--red)}
.tab2{display:flex;gap:.5rem;margin:0 .75rem .6rem}.tab2 span{flex:1;background:#fff;border-radius:.9rem;padding:.8rem;text-align:center;font-size:1rem;font-weight:800}.tab2 span.on{background:var(--plum);color:#fff}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;padding:0 .75rem}.chips span{font-size:.85rem;padding:.45rem .7rem;border-radius:999px;background:#fff;color:#444;border:1px solid var(--line)}.chips span.on{background:var(--plum);color:#fff;border-color:var(--plum);font-weight:700}
.rec{padding:.55rem 0;border-bottom:1px solid var(--line)}.rec:last-child{border:0}.rec .h{font-size:.8rem;color:var(--mute)}.rec .b{font-size:1rem;margin-top:.15rem;white-space:pre-wrap;word-break:break-word}.rec .b b{color:var(--rose)}
.rec .dt{font-size:.9rem;color:#444;background:var(--bg);border-radius:.6rem;padding:.5rem .6rem;margin-top:.4rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}.rec .dt.kakao{background:#FFF7D6;border-left:3px solid #F2C94C}
.pics{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}.pics img,.pics .ph{width:4.2rem;height:4.2rem;border-radius:.6rem;object-fit:cover;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.pbtn{display:flex;gap:.5rem;margin-top:.6rem}.pbtn div{flex:1;background:#fff;border:2px dashed #bbb;border-radius:.9rem;padding:.7rem;text-align:center;font-size:.95rem;font-weight:700}.pbtn div em{display:block;font-style:normal;font-size:1.6rem;margin-bottom:.1rem}
/* 공정 목록 */
.pl .row{padding:.65rem 0;border-bottom:1px solid var(--line);font-size:1rem}.pl .row:last-child{border:0}
.dot{width:.6rem;height:.6rem;border-radius:50%;display:inline-block;margin-right:.5rem;background:#ccc;flex:none}.dot.g{background:var(--green)}.dot.r{background:var(--rose)}.dot.x{background:var(--red)}
/* 시트(편집 창) */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:13;display:none}.dim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:1.3rem 1.3rem 0 0;padding:.6rem 1rem calc(env(safe-area-inset-bottom) + 1.2rem);z-index:14;max-height:92vh;overflow-y:auto;display:none}.sheet.on{display:block}
.sheet .h{width:2.5rem;height:4px;background:#ddd;border-radius:9px;margin:0 auto .7rem}
.sheet .chips{padding:0}
label.l{display:block;font-size:.85rem;color:var(--mute);margin:.8rem 0 .3rem;font-weight:700}
.in,select.in,textarea.in,input.in{display:block;width:100%;background:var(--bg);border:0;border-radius:.8rem;padding:.85rem .9rem;font-size:1.05rem;color:#222;outline:none}
.sheet .in,.rec-ov .in{background:#fff;border:1.5px solid var(--line)}
textarea.in{min-height:5rem;resize:vertical;line-height:1.5}
.seg{display:flex;gap:.35rem}.seg span{flex:1;text-align:center;padding:.8rem .2rem;border-radius:.7rem;background:var(--bg);font-size:1rem;font-weight:700}.seg span.on{background:var(--plum);color:#fff}
.save{margin-top:.9rem;background:var(--rose);color:#fff;border:0;border-radius:1rem;width:100%;padding:1rem;font-size:1.2rem;font-weight:800}.save:disabled{opacity:.5}
.ghost{margin-top:.4rem;background:transparent;border:0;width:100%;padding:.7rem;color:var(--mute);font-size:.95rem;font-weight:700}.ghost.danger{color:var(--red)}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:1rem;margin-top:.9rem;font-weight:700;gap:.5rem}.tog i{width:3rem;height:1.8rem;border-radius:99px;background:#ccc;position:relative;transition:.15s;flex:none}.tog i::after{content:"";position:absolute;left:3px;top:3px;width:calc(1.8rem - 6px);height:calc(1.8rem - 6px);border-radius:50%;background:#fff;transition:.15s}.tog.on i{background:var(--rose)}.tog.on i::after{left:calc(1.2rem + 3px)}
.note{font-size:.85rem;color:var(--mute);margin-top:.5rem;line-height:1.5}.note.warn{color:#8a5a00;background:#FFF3D1;border-radius:.6rem;padding:.5rem .6rem}
.more{font-size:.95rem;color:var(--mute);margin-top:.8rem;display:flex;justify-content:space-between;font-weight:700}
/* 기록 전체화면 */
.rec-ov{position:fixed;inset:0;background:var(--bg);z-index:12;display:none;flex-direction:column}.rec-ov.on{display:flex}
.rhead{background:var(--plum);color:#fff;padding:calc(env(safe-area-inset-top) + .8rem) 1rem .7rem;flex:none}.rhead .d{font-size:1.4rem;font-weight:800}.rhead .sub{font-size:.85rem;opacity:.88;margin-top:.2rem}
.rbody{flex:1;overflow-y:auto;padding:.9rem .9rem 2rem}
.rfoot{flex:none;padding:.5rem .9rem calc(env(safe-area-inset-bottom) + .5rem);background:var(--bg);border-top:1px solid var(--line)}.rfoot .save{margin-top:0}
.q{font-size:1.35rem;font-weight:800;margin:.2rem .1rem .8rem}
.opt{background:#fff;border-radius:1rem;padding:1rem .9rem;font-size:1.2rem;font-weight:800;margin-bottom:.6rem;display:flex;align-items:center;gap:.7rem;border:3px solid transparent}.opt i{width:1rem;height:1rem;border-radius:.25rem;flex:none}.opt.on{border-color:var(--rose);background:var(--blush)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}.grid2 .opt{flex-direction:column;justify-content:center;padding:.9rem .4rem;font-size:1.05rem;text-align:center;gap:.25rem;min-height:5.2rem;margin:0}.grid2 .opt em{font-style:normal;font-size:1.7rem}
.back{font-size:1rem;color:var(--mute);text-align:center;padding:.6rem;font-weight:700}
.done{position:fixed;left:.75rem;right:.75rem;bottom:calc(env(safe-area-inset-bottom) + 8.4rem);background:var(--green);color:#fff;border-radius:1rem;padding:.9rem 1rem;font-size:1.1rem;font-weight:800;display:none;justify-content:space-between;align-items:center;gap:.5rem;box-shadow:0 .6rem 1.4rem rgba(0,0,0,.25);z-index:9}.done.on{display:flex}.done small{font-weight:400;font-size:.8rem;opacity:.9;display:block}.done span{background:rgba(255,255,255,.25);padding:.45rem .8rem;border-radius:.6rem;font-size:.9rem;flex:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12.5rem);transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1rem;border-radius:999px;font-size:.9rem;z-index:40;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}.toast.on{opacity:1}
.sync{position:fixed;top:calc(env(safe-area-inset-top) + .4rem);right:.7rem;font-size:.7rem;padding:.25rem .6rem;border-radius:999px;z-index:6;color:#fff;font-weight:700}.sync.wait{background:#F2994A}.sync.ok{background:#2FA86A}.sync.err{background:#E04848}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:30;color:var(--mute);font-size:1rem}
</style></head>
<body>
<header id="hd"></header>
<main id="main"></main>
<div class="bbar" id="bbar"></div>
<nav id="nav"></nav>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<div class="rec-ov" id="rec"></div>
<div class="done" id="done"></div>
<div class="toast" id="toast"></div>
<div class="sync" id="sync" style="display:none"></div>
<div class="loading" id="loading">불러오는 중…</div>

<script>
// ============ 유틸 ============
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=s=>{const m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],m[2]-1,+m[3]):null};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'';
const DOW='일월화수목금토';
const dow=s=>DOW[pd(s).getDay()];
const isWork=d=>d.getDay()%6!==0;
const addWork=(d,n)=>{d=new Date(d);while(n>0){d.setDate(d.getDate()+1);if(isWork(d))n--;}return d};
const nextWork=d=>addWork(d,1);
const workdays=(a,b)=>{let n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))if(isWork(d))n++;return Math.max(n,1)};
const won=n=>n?Number(n).toLocaleString():'0';
const man=n=>{n=+n||0;if(n>=100000000){const e=Math.floor(n/100000000),m=Math.round((n%100000000)/10000);return e+'억'+(m?' '+m.toLocaleString()+'만':'');}return n>=10000?Math.round(n/10000).toLocaleString()+'만':won(n);};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
const TYPES=[['공정 끝','✅'],['공정 시작','▶️'],['투입','👷'],['현장 점검','🔍'],['특이사항','⚠️'],['고객 대화','💬'],['제품 선택','🧱']];
const ACTIVE=['계약','시공중','AS'];

// ============ 저장 원칙: 기록 먼저, 저장은 뒤에서 ============
// 모든 쓰기 = ① 화면 상태 D 에 즉시 반영 → ② 대기열(IndexedDB)에 기록 → ③ 뒤에서 시트로 순서대로 전송.
// 앱을 바로 꺼도 대기열은 남아 다음에 열 때 이어 보냄. 대기열이 비기 전엔 서버 데이터로 화면을 덮지 않음(체크 풀림 방지).
// 설정: 접속 링크(?api=서버주소&k=키)로 한 번 열면 기기에 저장. 링크를 홈 화면에 추가하면 홈 화면 앱에도 같이 들어감
const CFG=(()=>{let a='',k='';try{const q=new URLSearchParams(location.search);a=q.get('api')||'';k=q.get('k')||'';
  if(a&&k){localStorage.setItem('os_api',a);localStorage.setItem('os_key',k);}else{a=localStorage.getItem('os_api')||'';k=localStorage.getItem('os_key')||'';}}catch(e){}return {api:a,key:k};})();
const GAS=!!(CFG.api&&CFG.key);
const LOCALHOST=/^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);setTimeout(()=>rej(new Error('기기 저장소가 응답하지 않습니다')),5000);const q=indexedDB.open('choegojib_os',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('outbox'))d.createObjectStore('outbox',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>rej(q.error);})},
  tx(store,mode,fn){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction(store,mode),r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);}))},
  add(v){return this.tx('outbox','readwrite',st=>st.add(v))},
  all(){return this.tx('outbox','readonly',st=>st.getAll())},
  del(id){return this.tx('outbox','readwrite',st=>st.delete(id))},
  async delWhere(pred){const ops=await this.all();for(const o of ops)if(pred(o))await this.del(o.id);},
  get(k){return this.tx('kv','readonly',st=>st.get(k))},
  set(k,v){return this.tx('kv','readwrite',st=>st.put(v,k))}
};
async function gas(fn,...args){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),fn==='addPhoto'?300000:fn==='getData'?30000:90000);
  try{const r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:CFG.key,fn,args}),redirect:'follow',signal:ac.signal});
    const j=await r.json();if(!j.ok){const e=new Error(j.error==='unauthorized'?'접속 키가 맞지 않습니다. 접속 링크로 다시 열어주세요':j.error);e.auth=j.error==='unauthorized';throw e;}return j.data;
  }finally{clearTimeout(tm);}
}
async function diagnose(){
  const o=[],cut=u=>u.length>64?u.slice(0,40)+'…'+u.slice(-16):u,box=$('#diag');box.textContent='진단 중…';
  o.push('서버 주소: '+cut(CFG.api||'(없음)'));
  o.push(/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(CFG.api)?'① 주소 형식: 정상':'① 주소 형식: 이상 (…/macros/s/…/exec 여야 함. /dev 이면 배포 전 주소)');

async function api(fn,...args){
  if(fn==='addRecord'){args[0].ID=args[0].ID||newId('r');args[0].일시=args[0].일시||now();}
  if(fn==='addSite')args[0].현장ID=args[0].현장ID||newId('S');
  if(fn==='addTeam')args[0].팀ID=args[0].팀ID||newId('T');
  const qargs=fn==='addPhoto'?[args[0],{idx:args[1].idx,name:args[1].name,mime:args[1].mime,b64:args[1].b64}]:JSON.parse(JSON.stringify(args)); // 서버로 보낼 원본(화면 반영 전 복사). 사진은 원본 b64 그대로
  const out=LOCAL[fn](...args);                  // ① 즉시 반영
  D.records.sort((x,y)=>x.일시<y.일시?1:-1);
  saveCache();
  if(GAS){try{await IDB.add({fn,args:qargs,t:Date.now()});}catch(e){toast('기기 저장 실패: '+(e.message||e));}pending++;badge();sync();} // ② → ③
  return out;

function saveCache(){try{IDB.set('D',JSON.stringify(D));}catch(e){}}
async function sync(){
  if(!GAS||syncing)return;syncing=true;
  try{const ops=await IDB.all();pending=ops.length;badge();
    for(const op of ops){await gas(op.fn,...op.args);await IDB.del(op.id);pending--;badge();}
    syncErr='';if(ops.length){syncing=false;await refresh();}
  }catch(e){syncErr=e.message||String(e);if(!e.auth)setTimeout(sync,15000);}
  finally{syncing=false;badge();}
}
async function refresh(){ // 대기열이 비었을 때만 서버 데이터로 교체
  if(!GAS||syncing)return;const ops=await IDB.all();if(ops.length)return;

function badge(){const el=$('#sync');if(!el)return;if(!GAS){el.style.display='none';return;}

  else{el.className='sync ok';el.textContent='모두 저장됨';badge.t=setTimeout(()=>{if(!pending&&!syncErr)el.style.display='none';},2000);}
}

const liveOf=id=>procsOf(id).filter(p=>p.상태!=='제외');

const LOCAL={
  addSite(s){const used=activeSites().map(x=>x.색);s.색=s.색||D.base.lists.색.find(c=>!used.includes(c))||D.base.lists.색[D.sites.length%D.base.lists.색.length];s.상태=s.상태||'계약';s.준공예정=s.준공예정||'';
    if(siteById(s.현장ID)){Object.assign(siteById(s.현장ID),s);return s.현장ID;}
    D.procs.push(...D.base.procs.map(p=>({현장ID:s.현장ID,순번:+p.순번,공정:p.공정,담당팀:'',시작:'',끝:'',상태:'예정',메모:''})));D.sites.push(s);return s.현장ID;},
  updateSite(id,p){Object.assign(siteById(id)||{},p);},
  updateProc(id,seq,p){Object.assign(procAt(id,seq)||{},p);},
  shiftProc(id,seq,end,follow,start){const r=simShift(id,seq,end,follow,start);if(!r)return null;r.procs.forEach(p=>Object.assign(procAt(id,p.순번),p));siteById(id).준공예정=r.준공예정;return r;},
  saveSchedule(id,rows){rows.forEach(r=>{const p=procAt(id,r.순번);if(p)Object.assign(p,{시작:r.시작||'',끝:r.끝||'',상태:r.상태||'예정'});});const ends=rows.filter(r=>r.끝&&r.상태!=='제외').map(r=>r.끝).sort();siteById(id).준공예정=ends.pop()||'';},
  addProc(id,name,after){const ps=procsOf(id);const seq=after?+after+1:ps.reduce((m,p)=>Math.max(m,+p.순번),0)+1;ps.filter(p=>+p.순번>=seq).forEach(p=>p.순번=+p.순번+1);D.procs.push({현장ID:id,순번:seq,공정:name,담당팀:'',시작:'',끝:'',상태:'예정',메모:''});return seq;},
  deleteProc(id,seq){D.procs=D.procs.filter(p=>!(p.현장ID===id&&+p.순번===+seq));},
  addRecord(r,photos){if(D.records.find(x=>x.ID===r.ID))return r.ID;
    if(photos&&photos.length)r.사진=photos.map(p=>'data:image/jpeg;base64,'+p.b64).concat(r.사진?String(r.사진).split('|'):[]).join('|');
    if(r.유형==='투입'&&!r.금액&&r.단가)r.금액=(+r.공수||0)*(+r.단가||0);
    if(r.유형==='공정 끝'&&r._seq){const p=procAt(r.현장ID,r._seq);if(p)p.상태='완료';}
    if((r.유형==='공정 시작'||r.유형==='날짜 변경')&&r._seq&&r._newEnd){const res=LOCAL.shiftProc(r.현장ID,r._seq,r._newEnd,r._follow!==false,r.일시.slice(0,10));const p=procAt(r.현장ID,r._seq);if(p)p.상태='진행';r.내용=`${r.공정} ${md(r.일시)} ~ ${md(r._newEnd)}${res&&res.moved?' · 뒤 공정 '+res.moved+'개 이동':''}${r.내용?' · '+r.내용:''}`;}
    delete r._seq;delete r._newEnd;delete r._follow;D.records.push(r);return r.ID;},
  addPhoto(id,p){const r=D.records.find(x=>x.ID===id);if(r&&p.thumb)r.사진=(r.사진?String(r.사진).split('|').filter(Boolean):[]).concat(p.thumb).join('|');},
  updateRecord(id,p){Object.assign(D.records.find(r=>r.ID===id)||{},p);},
  deleteRecord(id){D.records=D.records.filter(r=>r.ID!==id);},
  addTeam(t){if(teamById(t.팀ID))return t.팀ID;D.teams.push(t);return t.팀ID;},
  updateTeam(id,p){Object.assign(teamById(id)||{},p);}
};

function siteBrief(s){ // 현장 하나의 오늘 상황을 문장으로
  const id=s.현장ID,ps=liveOf(id),total=ps.length,done=ps.filter(p=>p.상태==='완료').length;
  const cur=ps.find(p=>dated(p)&&p.시작<=D.today&&D.today<=p.끝&&p.상태!=='완료');
  const warn=ps.filter(late).map(p=>`⚠ ${esc(short(p.공정))}${josa(short(p.공정),'이','가')} 예정보다 ${Math.max(1,workdays(pd(p.끝),pd(D.today))-1)}일 늦었습니다`);
  let main;
  if(cur){const i=workdays(pd(cur.시작),pd(D.today)),n=workdays(pd(cur.시작),pd(cur.끝));main=`오늘 <b>${esc(short(cur.공정))}</b>${n>1?(i>=n?' 마지막 날':` ${i}일째 / ${n}일`):''}${cur.담당팀?' · '+esc(teamName(cur.담당팀)):''}`;}
  else if(!ps.some(p=>p.시작))main=total?'일정 미정 · 공정표에서 일정을 잡아주세요':'공정 없음';
  else if(total&&done===total)main='모든 공정 끝';
  else main='오늘 공정 없음';
  const nx=ps.find(p=>dated(p)&&p.시작>D.today&&p.상태!=='완료');
  const next=nx?`${esc(short(nx.공정))} · ${kdate(nx.시작)}`:'';
  const ev=[];
  if(s.착공일&&s.착공일>=D.today&&daysBetween(D.today,s.착공일)<=7)ev.push(`${md(s.착공일)} 📷 비포 촬영 · 착공`);
  if(s.준공예정&&s.준공예정>=D.today&&daysBetween(D.today,s.준공예정)<=7)ev.push(`${md(s.준공예정)} 📷 애프터 촬영 · 준공`);
  return {main,next,warn,ev,cur,done,total,pct:total?Math.round(done/total*100):0};
}

}

// ---- 달력: 주 단위(기본) / 월 ----
function renderCal(){
  if(!S.wk)S.wk=monday(D.today);
  const tog=`<div class="seg2"><span class="${S.calMode==='week'?'on':''}" onclick="S.calMode='week';S.wk=monday(S.day||D.today);render()">주</span><span class="${S.calMode==='month'?'on':''}" onclick="S.calMode='month';S.ym=S.wk.slice(0,7);S.day=D.today.slice(0,7)===S.ym?D.today:S.ym+'-01';render()">월</span></div>`;
  if(S.calMode==='week')renderWeek(tog);else renderMonth(tog);
}
const chip=(s,txt,sm='')=>`<div class="chip" onclick="go('site','${s.현장ID}')"><i style="background:${s.색}"></i>${esc(s.고객명)} · ${txt} ${sm}</div>`;
function renderWeek(tog){
  const days=[];for(let i=0;i<7;i++)days.push(shiftDays(S.wk,i));
  const a=days[0],b=days[6];
  $('#hd').innerHTML=`<div class="row"><span class="d">${+a.slice(5,7)}월 ${['첫째','둘째','셋째','넷째','다섯째'][Math.ceil(+a.slice(8,10)/7)-1]||''} 주</span>${tog}</div><div class="sub">${md(a)} ~ ${md(b)}</div>`;
  const nav=`<div class="wnav"><span onclick="S.wk=shiftDays(S.wk,-7);render()">‹ 지난주</span><b onclick="S.wk=monday(D.today);render()">이번 주</b><span onclick="S.wk=shiftDays(S.wk,7);render()">다음주 ›</span></div>`;
  const rows=days.map(d=>{const w=pd(d).getDay(),ev=[];
    D.sites.forEach(s=>{
      if(s.착공일===d)ev.push(chip(s,'📷 비포 촬영 · 착공'));if(s.준공예정===d)ev.push(chip(s,'📷 애프터 촬영 · 준공'));if(s.계약일===d&&['상담','계약'].includes(s.상태))ev.push(chip(s,s.상태));
      if(w===0||w===6)return;
      const p=liveOf(s.현장ID).find(p=>dated(p)&&p.시작<=d&&d<=p.끝);if(!p)return;
      const n=workdays(pd(p.시작),pd(p.끝)),i=workdays(pd(p.시작),pd(d));
      let sm='';if(d===D.today&&late(p))sm=`<small class="r">${Math.max(1,workdays(pd(p.끝),pd(D.today))-1)}일 늦음</small>`;else if(n>1)sm=`<small>${i===1?'시작':i>=n?'마지막 날':i+'/'+n+'일'}</small>`;
      ev.push(chip(s,esc(short(p.공정)),sm));});
    return `<div class="wday ${w===0?'sun':w===6?'sat':''} ${d===D.today?'today':''}"><div class="dn"><b>${+d.slice(8)}</b><span>${dow(d)}${d===D.today?'·오늘':''}</span></div><div class="ev">${ev.join('')||`<div class="off">${w===0||w===6?'쉬는 날':'공정 없음'}</div>`}</div></div>`;}).join('');
  $('#main').innerHTML=nav+`<div class="wk">${rows}</div>`;
}
function renderMonth(tog){
  const [y,m]=S.ym.split('-').map(Number);
  $('#hd').innerHTML=`<div class="row"><span class="d">${y}년 ${m}월</span>${tog}</div><div class="row" style="margin-top:.5rem"><button onclick="moveMonth(-1)">‹ 지난달</button><button onclick="moveMonth(0)">오늘</button><button onclick="moveMonth(1)">다음달 ›</button></div>
  <div class="legend">${activeSites().map(s=>`<span style="background:${s.색}">${esc(s.고객명)}</span>`).join('')}</div>`;
  const first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  let g='';for(let i=0;i<first;i++)g+='<div class="day blank"></div>';
  for(let d=1;d<=days;d++){
    const ds_=`${S.ym}-${String(d).padStart(2,'0')}`, w=(first+d-1)%7;
    let bars='';
    D.sites.forEach(s=>{
      const evs=[];if(s.착공일===ds_)evs.push('착공');if(s.준공예정===ds_)evs.push('준공');if(s.계약일===ds_&&['상담','계약'].includes(s.상태))evs.push(s.상태);
      evs.forEach(e=>bars+=`<div class="b ev" style="border-color:${s.색};color:${s.색}">${e}</div>`);
      if(w===0||w===6)return;
      const p=liveOf(s.현장ID).find(p=>dated(p)&&p.시작<=ds_&&ds_<=p.끝);if(!p)return;
      const pos=p.시작===p.끝?'':p.시작===ds_?'start':p.끝===ds_?'end':'cont';
      bars+=`<div class="b ${pos} ${(p.시작===ds_||w===1)?'lbl':''}" style="background:${s.색}">${esc(short(p.공정))}</div>`;
    });
    g+=`<div class="day ${w===0?'sun off':w===6?'sat off':''} ${ds_===D.today?'today':''} ${ds_===S.day?'sel':''}" onclick="pickDay('${ds_}')"><div class="n">${d}</div>${bars}</div>`;
  }
  $('#main').innerHTML=`<div class="cal"><div class="wd">${[...'일월화수목금토'].map(c=>`<span>${c}</span>`).join('')}</div><div class="grid">${g}</div></div>${dayPanel()}`;
}
function moveMonth(n){if(n===0){S.ym=D.today.slice(0,7);S.day=D.today;}else{const [y,m]=S.ym.split('-').map(Number);const d=new Date(y,m-1+n,1);S.ym=ds(d).slice(0,7);S.day=S.ym+'-01';}render();}
function pickDay(d){S.day=d;render();}
function dayPanel(){
  const day=S.day;
  const rows=D.sites.map(s=>{
    const p=liveOf(s.현장ID).find(p=>dated(p)&&p.시작<=day&&day<=p.끝);
    const evs=[];if(s.착공일===day)evs.push('착공 · 📷 비포 촬영');if(s.준공예정===day)evs.push('준공예정 · 📷 애프터 촬영');if(s.계약일===day)evs.push(s.상태==='상담'?'상담':'계약');
    if(!p&&!evs.length)return '';
    const recs=D.records.filter(r=>r.현장ID===s.현장ID&&r.일시.slice(0,10)===day);
    return `<div class="site" onclick="go('site','${s.현장ID}')"><i style="background:${s.색}"></i><div style="flex:1"><div class="t">${esc(s.고객명)} · ${p?esc(short(p.공정)):evs[0]} ${p&&late(p)?'<span class="tag red">늦음</span>':''}</div>
      <div class="s">${[p&&p.담당팀?esc(teamName(p.담당팀)):'',p?`${md(p.시작)}~${md(p.끝)}`:'',recs.length?`기록 ${recs.length}`:'',...(p?evs:[])].filter(Boolean).join(' · ')}</div></div></div>`;
  }).join('');
  return `<h2>${+day.slice(8)}일 ${dow(day)}요일${day===D.today?' · 오늘':''}</h2><div class="card">${rows||'<div class="empty">이 날 공정 없음</div>'}</div>`;
}

// ---- 현장 목록 ----
function renderSites(){
  $('#hd').innerHTML=`<div class="row"><span class="d">현장</span><span><button onclick="go('teams')">👷 외주팀</button> <button onclick="openSiteForm()">＋ 새 현장</button></span></div>`;
  const order=s=>({시공중:0,계약:1,AS:2,상담:3,준공:4,취소:5}[s.상태]??9);
  const list=[...D.sites].sort((a,b)=>order(a)-order(b)||(b.착공일||'').localeCompare(a.착공일||''));
  $('#main').innerHTML=list.map(s=>siteCard(s,siteBrief(s),true)).join('')||'<div class="empty">현장을 추가하세요</div>';
}

// ---- 현장 상세 ----
function renderSite(){
  const s=siteById(S.site);if(!s)return go('sites');
  const ps=liveOf(s.현장ID),b=siteBrief(s);
  const labor=D.records.filter(r=>r.현장ID===s.현장ID&&r.유형==='투입').reduce((a,r)=>a+(+r.금액||0),0);
  const conf=[];ps.filter(p=>dated(p)&&p.담당팀&&p.끝>=D.today&&p.상태!=='완료').forEach(p=>D.procs.filter(q=>q.현장ID!==s.현장ID&&q.담당팀===p.담당팀&&dated(q)&&q.상태!=='완료'&&q.시작<=p.끝&&p.시작<=q.끝).forEach(q=>conf.push(`${esc(teamName(p.담당팀))} ${md(p.시작>q.시작?p.시작:q.시작)} ${esc(siteById(q.현장ID)?.고객명||'')}과 겹침`)));
  const notes=[...b.warn.map(w=>w.replace('⚠ ','')),...new Set(conf)];
  $('#hd').innerHTML=`<div class="row"><div><div class="d"><span onclick="go('sites')" style="opacity:.7">‹</span> ${esc(s.고객명)} ${esc(s.평형||'')}</div><div class="sub">${esc(s.주소||'')}${s.연락처?` · <a href="tel:${esc(s.연락처)}">📞 ${esc(s.연락처)}</a>`:''}</div></div><button onclick="openSiteForm('${s.현장ID}')">정보</button></div>`;
  let h=`<div class="scard" style="border-left-color:${s.색}"><div class="n">${b.done} / ${b.total} 공정 끝 <span class="tag ${s.상태==='시공중'?'':'gray'}">${s.상태}</span></div><div class="bar"><i style="width:${b.pct}%"></i></div>
    <div class="kv"><div><small>계약금액</small><b>${s.계약금액?man(+s.계약금액):'—'}</b></div><div><small>노무비 누계</small><b>${man(labor)}</b></div><div><small>준공예정</small><b>${s.준공예정?md(s.준공예정)+' ('+dow(s.준공예정)+')':'미정'}</b></div><div><small>📷 촬영</small><b style="font-size:.95rem">비포 ${s.착공일?md(s.착공일):'—'}<br>애프터 ${s.준공예정?md(s.준공예정):'—'}</b></div></div></div>
    <div class="card lines"><div class="ln"><span class="k">오늘</span><span class="v">${b.main.replace(/^오늘 /,'')}</span></div>${b.next?`<div class="ln"><span class="k">다음</span><span class="v">${b.next}</span></div>`:''}${notes.map(n=>`<div class="ln r"><span class="k">주의</span><span class="v">${n}</span></div>`).join('')}</div>
    <div class="tab2"><span class="${S.tab==='기록'?'on':''}" onclick="S.tab='기록';render()">기록 보기</span><span class="${S.tab==='공정'?'on':''}" onclick="S.tab='공정';render()">공정표 보기${ps.filter(late).length?' ⚠':''}</span></div>`;
  h+=S.tab==='기록'?timeline(s):procList(s);
  $('#main').innerHTML=h;
}
function timeline(s){
  const all=D.records.filter(r=>r.현장ID===s.현장ID);
  const f=S.filter, list=f==='전체'?all:all.filter(r=>r.유형===f);
  const chips=['전체',...TYPES.map(t=>t[0])].map(t=>`<span class="${f===t?'on':''}" onclick="S.filter='${t}';render()">${t}</span>`).join('');
  if(!list.length)return `<div class="chips">${chips}</div><div class="empty">기록이 없습니다.<br>아래 "＋ 이 현장에 기록"을 누르세요</div>`;
  const groups={};list.forEach(r=>{(groups[r.일시.slice(0,10)]=groups[r.일시.slice(0,10)]||[]).push(r)});
  return `<div class="chips">${chips}</div>`+Object.keys(groups).sort().reverse().map(d=>{
    const p=liveOf(s.현장ID).find(p=>dated(p)&&p.시작<=d&&d<=p.끝);
    return `<h2>${d===D.today?'오늘 · ':''}${md(d)} ${dow(d)}요일${p?' · '+esc(short(p.공정)):''}</h2><div class="card">${groups[d].map(r=>recHtml(r)).join('')}</div>`;}).join('');
}
function recHtml(r,withSite){
  const ico=Object.fromEntries(TYPES)[r.유형]||'•';
  const pics=r.사진?`<div class="pics">${String(r.사진).split('|').filter(Boolean).map(id=>`<img src="${thumb(id)}" onclick="event.stopPropagation();openPhoto('${id}')">`).join('')}</div>`:'';
  const sub=r.유형==='투입'?` · ${esc(teamName(r.팀ID))} ${r.단가?won(r.단가)+'×':''}${r.공수} · ${won(r.금액)}원${r.지급?' ✓지급':''}`:'';
  const when=(r.일시.slice(0,10)===D.today?'오늘 ':md(r.일시)+' ')+r.일시.slice(11);
  return `<div class="rec" onclick="openRecordEdit('${r.ID}')"><div class="h">${when} · ${ico} ${esc(r.유형)}${withSite?' · '+esc(siteById(r.현장ID)?.고객명||''):''}${esc(sub)}</div><div class="b">${esc(r.내용)}</div>${r.상세?`<div class="dt ${r.유형==='고객 대화'?'kakao':''}">${esc(r.상세)}</div>`:''}${pics}</div>`;
}
function procList(s){
  const ps=procsOf(s.현장ID);
  if(!ps.length)return `<div class="empty">공정이 없습니다</div>`;
  const nodate=ps.filter(p=>p.상태!=='제외'&&!p.시작).length;
  return `<div style="margin:0 .75rem .6rem;display:flex;gap:.5rem"><button class="save" style="margin:0;flex:1" onclick="openSchedule('${s.현장ID}')">📅 일정 잡기${nodate?` · 미정 ${nodate}`:''}</button><button class="save" style="margin:0;width:auto;background:var(--plum)" onclick="openAddProc('${s.현장ID}')">＋ 공정</button></div>
    <div class="card pl">${ps.map(p=>`<div class="row" onclick="openProc('${s.현장ID}',${p.순번})" style="${p.상태==='제외'?'opacity:.4':''}"><span style="display:flex;align-items:center;min-width:0"><i class="dot ${p.상태==='완료'?'g':p.상태==='진행'?'r':late(p)?'x':''}"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.순번} ${esc(p.공정)}</span></span>
    <span class="s" style="white-space:nowrap">${p.상태==='제외'?'제외':p.시작?`${p.담당팀?esc(teamName(p.담당팀))+' · ':''}${md(p.시작)}${p.시작!==p.끝?'~'+md(p.끝):''}`:'<span style="color:#bbb">날짜 없음</span>'} ${late(p)?'<span class="tag red">늦음</span>':p.상태==='진행'?'<span class="tag">진행</span>':''}</span></div>`).join('')}</div>
    <div class="note" style="margin:0 1rem">공정을 누르면 상태·담당팀·날짜를 바꿀 수 있고, 끝 날짜를 바꾸면 뒤 공정이 같이 밀립니다.</div>`;
}

// ---- 일정 잡기: 공정별 시작~끝을 대표님이 직접 ----
const SC={rows:[]};
function openSchedule(siteId){
  SC.site=siteId;SC.rows=procsOf(siteId).map(p=>({순번:p.순번,공정:p.공정,시작:p.시작||'',끝:p.끝||'',상태:p.상태}));
  drawSchedule();
}
function drawSchedule(){
  const s=siteById(SC.site);
  openSheet(`<div class="row"><div class="t">일정 잡기 · ${esc(s.고객명)}</div><span class="s">끝 비우면 하루</span></div>
    <div class="note">시작을 넣으면 다음 공정 시작이 그 다음 근무일로 미리 채워집니다. 전부 고칠 수 있고, 안 하는 공정은 ✕.</div>
    <div class="pl" style="margin-top:6px">${SC.rows.map((r,i)=>`<div class="row" style="padding:7px 0;gap:6px;${r.상태==='제외'?'opacity:.4':''}">
      <span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.순번} ${esc(r.공정.split('(')[0])}</span>
      <input type="date" class="in" style="width:118px;padding:8px 4px;font-size:12px" value="${r.시작}" ${r.상태==='제외'?'disabled':''} onchange="scSet(${i},'시작',this.value)">
      <input type="date" class="in" style="width:118px;padding:8px 4px;font-size:12px" value="${r.끝}" ${r.상태==='제외'?'disabled':''} onchange="scSet(${i},'끝',this.value)">
      <span style="width:22px;text-align:center;color:#999" onclick="scToggle(${i})">${r.상태==='제외'?'＋':'✕'}</span></div>`).join('')}</div>
    <div class="note" id="sc_sum">${scSummary()}</div>
    <button class="save" onclick="saveSchedule()">저장</button>
    <button class="ghost" onclick="openAddProc('${s.현장ID}')">＋ 공정 추가 (목록에 없는 공정)</button>
    <button class="ghost" onclick="scStandard()">LX 표준 소요일로 초안 채우기 (${s.착공일?md(s.착공일)+'부터':'착공일 필요'})</button>`);
}
function scSet(i,k,v){
  const r=SC.rows[i];r[k]=v;
  if(k==='시작'&&v&&(!r.끝||r.끝<v))r.끝=v;
  if(k==='끝'&&v&&r.시작&&r.시작>v)r.시작=v;
  if(k==='끝'&&v){const n=SC.rows.slice(i+1).find(x=>x.상태!=='제외');if(n&&!n.시작){n.시작=ds(nextWork(pd(v)));n.끝=n.끝||n.시작;}}
  drawSchedule();
}
function scToggle(i){const r=SC.rows[i];r.상태=r.상태==='제외'?'예정':'제외';drawSchedule();}
function scSummary(){const live=SC.rows.filter(r=>r.상태!=='제외'),ends=live.filter(r=>r.끝).map(r=>r.끝).sort();return `공정 ${live.length}개 · 날짜 없는 공정 ${live.filter(r=>!r.시작).length} · 준공예정 ${ends.length?md(ends[ends.length-1]):'미정'}`;}
function scStandard(){
  const s=siteById(SC.site);if(!s.착공일)return toast('현장 정보에 착공일을 먼저 넣으세요');
  let d=pd(s.착공일);if(!isWork(d))d=nextWork(d);
  SC.rows.forEach(r=>{if(r.상태==='제외'||r.상태==='완료')return;const dur=D.base.procs.find(b=>b.공정===r.공정)?.기본소요일||1;const st=new Date(d),en=addWork(st,dur-1);r.시작=ds(st);r.끝=ds(en);d=nextWork(en);});
  drawSchedule();
}
function openAddProc(siteId){
  const ps=procsOf(siteId);
  openSheet(`<div class="t">공정 추가</div><label class="l">공정 이름 *</label><input class="in" id="ap_name" placeholder="예: 탄성코트, 줄눈, 방충망">
    <label class="l">어디 뒤에</label><select class="in" id="ap_after">${opt(ps,ps.length?ps[ps.length-1].순번:'',p=>p.순번+' '+p.공정+' 뒤',p=>p.순번)}<option value="">맨 앞</option></select>
    <label class="l">시작 · 끝 (선택, 나중에 일정 잡기에서도 됨)</label><div style="display:flex;gap:6px"><input type="date" class="in" id="ap_s"><input type="date" class="in" id="ap_e"></div>
    <button class="save" onclick="saveAddProc('${siteId}')">추가</button>`);
}
async function saveAddProc(siteId){
  const name=val('ap_name');if(!name)return toast('공정 이름을 쓰세요');
  const seq=await api('addProc',siteId,name,val('ap_after'));
  if(val('ap_s'))await api('updateProc',siteId,seq,{시작:val('ap_s'),끝:val('ap_e')||val('ap_s')});
  closeSheet();toast(name+' 추가됨');render();if(S.view==='site'){S.tab='공정';render();}
}
async function saveSchedule(){
  const rows=SC.rows.map(r=>({순번:r.순번,시작:r.시작,끝:r.끝||r.시작,상태:r.상태}));
  await api('saveSchedule',SC.site,rows);closeSheet();toast('일정 저장됨');render();
}

// ---- 외주팀 ----

const opt=(list,val,label=x=>x,value=x=>x,blank)=>(blank?`<option value="">${blank}</option>`:'')+list.map(x=>`<option value="${esc(value(x))}" ${value(x)==val?'selected':''}>${esc(label(x))}</option>`).join('');

// ---- 사진: 원본 화질 그대로 드라이브에 (영상 편집용) ----
const PH=[]; // {name,mime,b64(원본),thumb(화면용 640px)}
const MAXMB=20;
function picsHtml(){return PH.map(p=>p.thumb?`<img src="${p.thumb}">`:'<div class="ph">🖼</div>').join('');}
function photoBtns(){return `<div class="pics" id="pics">${picsHtml()}</div><div class="pbtn"><div onclick="$('#cam').click()"><em>📷</em>사진 찍기</div><div onclick="$('#alb').click()"><em>🖼</em>앨범에서</div></div><div class="note">원본 화질 그대로 드라이브 <b>현장OS</b> 폴더에 저장됩니다. 편집용 컷은 앨범에서 고르면 가장 좋습니다</div><input type="file" id="cam" accept="image/*" capture="environment" hidden onchange="addPhotos(this.files)"><input type="file" id="alb" accept="image/*" multiple hidden onchange="addPhotos(this.files)">`;}
async function addPhotos(files){
  for(const f of files){
    if(f.size>MAXMB*1048576){toast(`${f.name}: ${MAXMB}MB가 넘어 뺐습니다`);continue;}
    let thumb='';try{thumb=await resize(f,640);}catch(e){}
    try{const b64=await readB64(f);PH.push({name:f.name||'photo.jpg',mime:f.type||'image/jpeg',b64,thumb});}catch(e){toast('사진을 읽지 못했습니다');}
  }
  const el=$('#pics');if(el)el.innerHTML=picsHtml();
  if(PH.length)toast(`사진 ${PH.length}장 준비됨`);
}
const readB64=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(f);});
function resize(file,M){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const r=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.7));};img.onerror=()=>{URL.revokeObjectURL(img.src);rej(new Error('decode'));};img.src=URL.createObjectURL(file);});}
function openPhoto(id){window.open(id.startsWith('data:')?id:`https://drive.google.com/file/d/${id}/view`,'_blank');}

// ---- ＋ 기록: 한 화면에 한 질문 (현장 → 종류 → 내용) ----
const R={site:null,type:null,step:1,follow:true,gs:1,checks:{},back:false,backProc:null};

  const act=activeSites();if(!act.length)return toast('먼저 현장을 등록하세요');
  PH.length=0;R.site=site||(S.view==='site'?S.site:null);R.type=type||null;R.follow=true;R.gs=1;R.checks={};
  if(R.site&&!siteById(R.site))R.site=null;
  if(!R.site&&act.length===1)R.site=act[0].현장ID;
  R.step=!R.site?1:(R.type?3:2);drawRec();
}
function openRecord(type,site){startRecord(type,site);} // 팀 추가 후 복귀용
function closeRec(){const el=$('#rec');el.classList.remove('on');el.innerHTML='';PH.length=0;}
function recHead(step,title){return `<div class="rhead"><div class="d">${title}</div><div class="sub">${step} / 3 단계${R.site&&step>1?' · '+esc(siteById(R.site)?.고객명||''):''}</div></div>`;}

  const el=$('#rec');el.classList.add('on');const act=activeSites();let h='';
  if(R.step===1)h=recHead(1,'기록하기')+`<div class="rbody"><div class="q">어느 현장인가요?</div>${act.map(x=>`<div class="opt ${x.현장ID===R.site?'on':''}" onclick="R.site='${x.현장ID}';R.step=2;drawRec()"><i style="background:${x.색}"></i>${esc(x.고객명)} ${esc(x.평형||'')}</div>`).join('')}</div><div class="rfoot"><div class="back" onclick="closeRec()">닫기</div></div>`;
  else if(R.step===2)h=recHead(2,'기록하기')+`<div class="rbody"><div class="q">무슨 기록인가요?</div><div class="grid2">${TYPES.map(([t,i])=>`<div class="opt ${R.type===t?'on':''}" onclick="R.type='${t}';R.step=3;drawRec()"><em>${i}</em>${t}</div>`).join('')}</div></div><div class="rfoot"><div class="back" onclick="${act.length>1?'R.step=1;drawRec()':'closeRec()'}">‹ ${act.length>1?'현장 다시 고르기':'닫기'}</div></div>`;
  else h=recHead(3,(Object.fromEntries(TYPES)[R.type]||'')+' '+R.type)+`<div class="rbody">${recFields()}</div><div class="rfoot"><button class="save" id="r_save" onclick="saveRecord()">저장</button><div class="back" onclick="R.step=2;drawRec()">‹ 종류 다시 고르기</div></div>`;
  el.innerHTML=h;const body=el.querySelector('.rbody');if(body)body.scrollTop=0;
  if(R.step===3&&R.type==='투입')calcAmt();

function recFields(){
  const ps=liveOf(R.site), cp=curProc(R.site,D.today);let f='';
  if(R.type==='공정 끝'){const def=ps.find(p=>p.상태==='진행')||ps.find(p=>p.상태!=='완료');f=`<label class="l">끝난 공정</label><select class="in" id="r_proc">${opt(ps.filter(p=>p.상태!=='완료'),def?.순번,p=>p.순번+' '+p.공정+(p.시작?' ('+md(p.시작)+'~'+md(p.끝)+')':''),p=>p.순번)}</select>`;}
  if(R.type==='공정 시작'){const def=ps.find(p=>p.상태==='진행')||ps.find(p=>p.상태!=='완료');f=`<label class="l">오늘 ${md(D.today)} 시작하는 공정</label><select class="in" id="r_proc" onchange="shiftPreview()">${opt(ps.filter(p=>p.상태!=='완료'),def?.순번,p=>p.순번+' '+p.공정,p=>p.순번)}</select>
    <label class="l">끝나는 날짜 (직접 선택)</label><input type="date" class="in" id="r_date" value="" min="${D.today}" onchange="shiftPreview()">
    <div class="tog ${R.follow?'on':''}" onclick="R.follow=!R.follow;this.classList.toggle('on');shiftPreview()"><span>뒤 공정 같이 밀기</span><i></i></div><div class="note" id="r_prev"></div>`;}
  if(R.type==='투입')f=`<label class="l">팀</label><select class="in" id="r_team" onchange="if(this.value==='__new'){R.back=true;openTeamForm();return}">${opt(D.teams,cp?.담당팀||'',t=>t.팀명+(t.공종?' · '+t.공종:''),t=>t.팀ID)}<option value="__new">＋ 새 팀 추가…</option></select>
    <label class="l">일당 (원)</label><input class="in" id="r_rate" inputmode="numeric" placeholder="예: 250000" oninput="calcAmt()">
    <label class="l">공수 (인원 × 일)</label><div class="seg" id="r_gs">${[0.5,1,2,3].map(g=>`<span class="${R.gs===g?'on':''}" onclick="setGs(${g})">${g}</span>`).join('')}<input class="in" id="r_gs_in" inputmode="decimal" placeholder="직접" style="flex:1;padding:.6rem .3rem;text-align:center" oninput="setGs(+this.value,true)"></div>
    <label class="l">금액 (일당 × 공수 자동, 고칠 수 있음)</label><input class="in" id="r_amt" inputmode="numeric"><label class="l">공정</label><select class="in" id="r_proc">${opt(ps,cp?.순번,p=>p.공정,p=>p.순번,'—')}</select>`;
  if(R.type==='현장 점검')f=`<label class="l">확인한 항목 (눌러서 ✓)</label><div class="chips" id="r_chk">${D.base.lists.점검항목.map(c=>`<span class="${R.checks[c]?'on':''}" onclick="R.checks['${c}']=!R.checks['${c}'];this.classList.toggle('on')">${c}</span>`).join('')}</div>`;
  if(R.type==='제품 선택')f=`<label class="l">품목</label><input class="in" id="r_item" placeholder="예: 욕실 타일, 주방 상판, 중문"><label class="l">고객이 고른 제품 · 색상</label><input class="in" id="r_prod" placeholder="예: LX 지인 베이지 300×600"><label class="l">관련 공정</label><select class="in" id="r_proc">${opt(ps,cp?.순번,p=>p.공정,p=>p.순번,'—')}</select>`;
  const txtLabel={'공정 끝':'메모 (선택)','공정 시작':'메모 (선택)','투입':'메모 (선택)','현장 점검':'보류·문제 (선택)','특이사항':'무슨 일인가요?','고객 대화':'제목 한 줄','제품 선택':'메모 (선택)'}[R.type];
  const mic=`<div class="note">키보드의 🎤 마이크를 누르고 말하면 글자로 들어갑니다</div>`;
  return f+`<label class="l">${txtLabel}</label>`+(R.type==='고객 대화'
    ?`<input class="in" id="r_text" placeholder="예: 욕실 타일 색상 확정"><label class="l">대화 내용 (카톡에서 복사해 붙여넣기)</label><textarea class="in" id="r_detail" placeholder="카톡 대화 복사 → 여기 붙여넣기. 캡처는 아래 사진으로"></textarea>${mic}`
    :`<textarea class="in" id="r_text" style="min-height:4rem" placeholder="${R.type==='특이사항'?'예: 욕실 타일 3박스 부족, 내일 추가 입고':''}"></textarea>${mic}`)
    +photoBtns()
    +(R.type!=='고객 대화'?`<div class="more" onclick="$('#r_detail').style.display='block';this.style.display='none'"><span>자세히 쓰기 (원인·조치·금액)</span><span>⌄</span></div><textarea class="in" id="r_detail" style="display:none;margin-top:.5rem"></textarea>`:'');

function setGs(g,typed){R.gs=g||0;$$('#r_gs span').forEach(e=>e.classList.toggle('on',!typed&&+e.textContent===g));if(!typed)$('#r_gs_in').value='';calcAmt();}
function calcAmt(){const rate=+val('r_rate').replace(/\D/g,'');$('#r_amt').value=rate&&R.gs?Math.round(rate*R.gs):'';}
function simShift(siteId,seq,newEnd,follow,newStart){ // 서버 shiftProc 과 같은 계산 (미리보기·목업용)
  const ps=procsOf(siteId).map(p=>({...p}));const t=ps.find(p=>+p.순번===+seq);if(!t)return null;
  if(!newEnd||!(newStart||t.시작))return null;let end=pd(newEnd),start=pd(newStart||t.시작);if(end<start)start=end;t.시작=ds(start);t.끝=ds(end);let cursor=end,moved=0;
  if(follow)ps.filter(p=>+p.순번>+seq&&dated(p)&&p.상태!=='완료').forEach(p=>{const dur=workdays(pd(p.시작),pd(p.끝));const st=nextWork(cursor),en=addWork(st,dur-1);if(ds(st)!==p.시작||ds(en)!==p.끝){p.시작=ds(st);p.끝=ds(en);moved++;}cursor=en;});
  return {procs:ps,moved,준공예정:ps.filter(dated).map(p=>p.끝).sort().pop()||''};
}
function shiftPreview(){
  const s=siteById(R.site),r=simShift(R.site,val('r_proc'),val('r_date'),R.follow,D.today);if(!r){$('#r_prev').textContent='';return;}
  const conf=[];r.procs.filter(p=>p.담당팀).forEach(p=>D.procs.filter(q=>q.현장ID!==R.site&&q.담당팀===p.담당팀&&q.시작<=p.끝&&p.시작<=q.끝).forEach(q=>conf.push(`${teamName(p.담당팀)} ${md(p.시작)} ${siteById(q.현장ID)?.고객명}과 겹침`)));
  $('#r_prev').innerHTML=`${md(D.today)} ~ ${md(val('r_date'))} · 뒤 공정 ${r.moved}개 이동 · 준공예정 ${md(s.준공예정)} → <b>${md(r.준공예정)}</b> · 📷 애프터 ${md(r.준공예정)}${conf.length?`<div class="note warn" style="margin-top:6px">⚠️ ${[...new Set(conf)].join('<br>')}</div>`:''}`;
}
async function saveRecord(){
  const r={현장ID:R.site,유형:R.type,내용:val('r_text'),상세:val('r_detail'),사진:'',팀ID:'',공수:'',금액:'',공정:'',지급:'',단가:''};
  const ps=procsOf(R.site),pr=ps.find(p=>+p.순번===+val('r_proc'));
  if(R.type==='공정 끝'){if(!pr)return toast('공정을 고르세요');r.공정=pr.공정;r._seq=pr.순번;r.내용=r.내용||`${pr.공정} 완료`;}
  if(R.type==='공정 시작'){if(!pr||!val('r_date'))return toast('공정과 끝나는 날짜를 고르세요');r.공정=pr.공정;r._seq=pr.순번;r._newEnd=val('r_date');r._follow=R.follow;}
  if(R.type==='투입'){if(!val('r_team')||val('r_team')==='__new')return toast('팀을 고르세요');if(!R.gs)return toast('공수를 넣으세요');r.팀ID=val('r_team');r.단가=+val('r_rate').replace(/\D/g,'')||'';r.공수=R.gs;r.금액=+val('r_amt').replace(/\D/g,'')||'';r.공정=pr?.공정||'';r.내용=r.내용||`${teamName(r.팀ID)} ${R.gs}공수`+(r.금액?' · '+won(r.금액)+'원':'');}
  if(R.type==='현장 점검'){const ok=Object.keys(R.checks).filter(k=>R.checks[k]);r.내용=(ok.length?ok.join(' ✓ ')+' ✓':'')+(r.내용?(ok.length?' · ':'')+'보류: '+r.내용:'');if(!r.내용)return toast('항목을 체크하세요');}
  if(R.type==='제품 선택'){if(!val('r_item')||!val('r_prod'))return toast('품목과 제품을 쓰세요');r.공정=pr?.공정||'';r.내용=`${val('r_item')}: ${val('r_prod')}`+(r.내용?' · '+r.내용:'');}
  if((R.type==='특이사항'||R.type==='고객 대화')&&!r.내용&&!r.상세&&!PH.length)return toast('내용을 쓰거나 사진을 넣으세요');
  const snap={site:R.site,procs:procsOf(R.site).map(p=>({순번:p.순번,시작:p.시작,끝:p.끝,상태:p.상태}))};
  const restore=R.type==='공정 끝'||R.type==='공정 시작';
  $('#r_save').disabled=true;
  const photos=PH.slice();
  const id=await api('addRecord',r,[]);                       // 기록 먼저
  photos.forEach((p,i)=>api('addPhoto',id,{idx:i+1,name:p.name,mime:p.mime,b64:p.b64,thumb:p.thumb})); // 사진은 뒤에서 원본 업로드
  closeRec();render();showDone(id,snap,restore,photos.length);
}
let doneT=null,doneCtx=null;
function showDone(id,snap,restore,nPhoto){
  const el=$('#done');let n=5;clearInterval(doneT);doneCtx={id,snap,restore};
  const paint=()=>el.innerHTML=`<div>저장됐습니다 ✓${nPhoto?`<small>사진 ${nPhoto}장은 뒤에서 올라갑니다</small>`:''}</div><span onclick="undoRecord()">취소 (${n})</span>`;
  el.classList.add('on');paint();
  doneT=setInterval(()=>{n--;if(n<=0){clearInterval(doneT);el.classList.remove('on');doneCtx=null;return;}paint();},1000);
}
async function undoRecord(){
  clearInterval(doneT);$('#done').classList.remove('on');const c=doneCtx;doneCtx=null;if(!c)return;
  try{await IDB.delWhere(op=>op.fn==='addPhoto'&&op.args[0]===c.id);}catch(e){}
  await api('deleteRecord',c.id);
  if(c.restore&&c.snap)await api('saveSchedule',c.snap.site,c.snap.procs);
  pending=(await IDB.all().catch(()=>[])).length;badge();toast('취소했습니다');render();
}

async function saveRecordEdit(id){
  const r=D.records.find(x=>x.ID===id);const p={내용:val('e_text'),상세:val('e_detail')};
  if(r.유형==='투입'){p.금액=+val('e_amt').replace(/\D/g,'')||'';p.지급=$('#e_paid').classList.contains('on')?'지급':'';}
  const ph=PH.slice();ph.forEach((x,i)=>api('addPhoto',id,{idx:100+i,name:x.name,mime:x.mime,b64:x.b64,thumb:x.thumb}));
  await api('updateRecord',id,p);closeSheet();toast('수정됨');render();
}
async function delRecord(id){if(!confirm('삭제할까요?'))return;await api('deleteRecord',id);closeSheet();toast('삭제됨');render();}

// ---- 공정 편집 ----
function openProc(siteId,seq){
  const p=procsOf(siteId).find(x=>+x.순번===+seq);R.follow=true;
  openSheet(`<div class="t">${p.순번} ${esc(p.공정)}</div><div class="s">${p.시작?md(p.시작)+' ~ '+md(p.끝):'날짜 없음'} · ${p.상태}${late(p)?' · <b style="color:var(--red)">지연</b>':''}</div>
    <label class="l">상태</label><div class="seg" id="p_st">${['예정','진행','완료','보류','제외'].map(s=>`<span class="${p.상태===s?'on':''}" onclick="$$('#p_st span').forEach(e=>e.classList.toggle('on',e===this))">${s}</span>`).join('')}</div>
    <label class="l">담당팀</label><select class="in" id="p_team" onchange="if(this.value==='__new'){R.backProc={s:'${siteId}',q:${seq},st:$('#p_st .on')?.textContent,a:val('p_start'),b:val('p_end')};openTeamForm();}">${opt(D.teams,p.담당팀,t=>t.팀명+(t.공종?' · '+t.공종:''),t=>t.팀ID,'— 없음')}<option value="__new">＋ 새 팀 추가…</option></select>
    <label class="l">시작</label><input type="date" class="in" id="p_start" value="${p.시작}">
    <label class="l">끝</label><input type="date" class="in" id="p_end" value="${p.끝}" onchange="procPreview('${siteId}',${seq})">
    <div class="tog on" id="p_follow" onclick="R.follow=!R.follow;this.classList.toggle('on');procPreview('${siteId}',${seq})"><span>끝 날짜 바꾸면 뒤 공정 같이 밀기</span><i></i></div><div class="note" id="p_prev"></div>
    <button class="save" onclick="saveProc('${siteId}',${seq},'${p.끝}')">저장</button><button class="ghost danger" onclick="if(confirm('이 공정을 지울까요?')){api('deleteProc','${siteId}',${seq}).then(()=>{closeSheet();render()})}">공정 삭제</button>`);
}
function procPreview(siteId,seq){const s=siteById(siteId),r=simShift(siteId,seq,val('p_end'),R.follow);if(r)$('#p_prev').textContent=`뒤 공정 ${r.moved}개 이동 · 준공예정 ${md(s.준공예정)} → ${md(r.준공예정)}`;}
async function saveProc(siteId,seq,oldEnd){
  const st=$('#p_st .on')?.textContent, p={상태:st,담당팀:val('p_team')==='__new'?'':val('p_team'),시작:val('p_start')};
  await api('updateProc',siteId,seq,p);
  if(val('p_end')!==oldEnd){if(oldEnd&&val('p_end'))await api('shiftProc',siteId,seq,val('p_end'),R.follow);else await api('updateProc',siteId,seq,{끝:val('p_end')});}
  closeSheet();toast('저장됨');render();
}

// ---- 현장 추가/수정 ----
function openSiteForm(id){

    <label class="l">고객명 *</label><input class="in" id="s_name" value="${esc(s.고객명||'')}" placeholder="예: 김○○ 세곡동">
    <label class="l">평형</label><input class="in" id="s_py" value="${esc(s.평형||'')}" placeholder="예: 32평">

async function saveSite(id){
  const p={고객명:val('s_name'),평형:val('s_py'),주소:val('s_addr'),연락처:val('s_tel'),계약금액:+val('s_amt').replace(/\D/g,'')||'',상태:val('s_st'),계약일:val('s_c'),착공일:val('s_start'),메모:val('s_memo')};
  if(!p.고객명)return toast('고객명을 쓰세요');
  if(id)await api('updateSite',id,p);else{const nid=await api('addSite',p);closeSheet();toast('현장 추가됨 · 일정을 잡으세요');render();S.site=nid;S.view='site';S.tab='공정';render();return;}
  closeSheet();toast('저장됨');render();
}

// ---- 팀 ----
function openTeamForm(id){
  const t=id?teamById(id):{};
  openSheet(`<div class="t">${id?'팀 정보':'새 팀'}</div>
    <label class="l">팀명 *</label><input class="in" id="t_name" value="${esc(t.팀명||'')}" placeholder="예: 타일팀 박반장">
    <label class="l">공종</label><select class="in" id="t_kind">${opt(D.base.procs.map(p=>p.공종),t.공종,x=>x,x=>x,'—')}</select>
    <label class="l">대표자 · 연락처</label><input class="in" id="t_rep" value="${esc(t.대표자||'')}" placeholder="이름"><input class="in" id="t_tel" inputmode="tel" value="${esc(t.연락처||'')}" placeholder="010-" style="margin-top:6px">
    <label class="l">계좌</label><input class="in" id="t_acct" value="${esc(t.계좌||'')}">
    <button class="save" onclick="saveTeam('${id||''}')">저장</button>`);
}
async function saveTeam(id){
  const p={팀명:val('t_name'),공종:val('t_kind'),대표자:val('t_rep'),연락처:val('t_tel'),계좌:val('t_acct')};
  if(!p.팀명)return toast('팀명을 쓰세요');
  const nid=await api(id?'updateTeam':'addTeam',...(id?[id,p]:[p]));closeSheet();toast('저장됨');render();if(R.back){R.back=false;openRecord('투입',R.site);if(nid)$('#r_team').value=nid;}
  else if(R.backProc){const b=R.backProc;R.backProc=null;openProc(b.s,b.q);if(nid)$('#p_team').value=nid;if(b.st)$$('#p_st span').forEach(e=>e.classList.toggle('on',e.textContent===b.st));if(b.a)$('#p_start').value=b.a;if(b.b)$('#p_end').value=b.b;}
}

function SEED(){
  const today=ds(new Date());const T=pd(today);const dayOff=n=>ds(new Date(T.getFullYear(),T.getMonth(),T.getDate()+n));
  const LX=[['실측·설계확정',1,'설계'],['철거',2,'철거'],['설비(배관·전기배선)',2,'설비'],['창호(샷시)',1,'창호'],['목공(천장·벽체·몰딩)',3,'목공'],['타일(욕실·현관·주방)',3,'타일'],['욕실 도기·수전',1,'욕실'],['도장',2,'도장'],['필름(문·몰딩)',2,'필름'],['바닥(마루·장판)',2,'바닥'],['도배',2,'도배'],['주방가구',1,'주방'],['붙박이장·중문·도어',1,'가구'],['조명·전기 마감',1,'전기'],['실리콘·준공청소',1,'청소'],['고객 검수·입주',1,'검수']];

  LOCAL.addSite({현장ID:'S4',고객명:'분당 상담',평형:'28평',주소:'분당 ○○',계약일:dayOff(14),상태:'상담'});

  rec({일시:dayOff(-3)+' 18:10',현장ID:'S1',유형:'공정 끝',내용:'목공(천장·벽체·몰딩) 완료',공정:'목공(천장·벽체·몰딩)'});

  D.records.sort((x,y)=>x.일시<y.일시?1:-1);return D;
